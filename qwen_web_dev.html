<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCodeCamp — Полный курс Python</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-700-normal.css">
<style>
  :root {
    --bg: #0a0a0a;
    --bg-elev: #1b1b32;
    --bg-elev2: #2a2a40;
    --text: #dfdfe0;
    --text-dim: #acacac;
    --accent: #f1be32;
    --accent-hover: #ffdf00;
    --green: #acd157;
    --red: #e71837;
    --blue: #3b82f6;
    --border: #3b3b4f;
  }
  * { box-sizing: border-box; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    margin: 0;
    padding: 0;
    height: 100%;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
  .scrollbar::-webkit-scrollbar-track { background: var(--bg); }
  .scrollbar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .scrollbar::-webkit-scrollbar-thumb:hover { background: #555; }

  .lesson-btn {
    text-align: left;
    padding: 10px 14px;
    border-radius: 4px;
    color: var(--text-dim);
    transition: all 0.15s;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    border: none;
    background: transparent;
    cursor: pointer;
  }
  .lesson-btn:hover { background: var(--bg-elev2); color: var(--text); }
  .lesson-btn.active { background: var(--bg-elev2); color: var(--accent); font-weight: 700; }
  .lesson-btn.completed::before {
    content: '✓';
    color: var(--green);
    font-weight: bold;
  }
  .lesson-btn:not(.completed)::before {
    content: '○';
    color: var(--text-dim);
  }

  .editor {
    background: #0d1117;
    color: #e6edf3;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    line-height: 1.6;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 100%;
    min-height: 200px;
    resize: vertical;
    outline: none;
    tab-size: 4;
  }
  .editor:focus { border-color: var(--accent); }

  .btn {
    padding: 10px 20px;
    border-radius: 4px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    font-size: 14px;
  }
  .btn-primary { background: var(--accent); color: #0a0a0a; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.5; cursor: wait; }
  .btn-secondary { background: var(--bg-elev2); color: var(--text); }
  .btn-secondary:hover { background: var(--border); }

  .content h1 { font-size: 28px; margin: 0 0 16px; color: var(--text); }
  .content h2 { font-size: 22px; margin: 24px 0 12px; color: var(--accent); }
  .content h3 { font-size: 18px; margin: 20px 0 10px; color: var(--text); }
  .content p { line-height: 1.7; margin: 10px 0; color: var(--text-dim); }
  .content ul, .content ol { padding-left: 24px; color: var(--text-dim); line-height: 1.7; }
  .content li { margin: 6px 0; }
  .content code {
    background: var(--bg-elev2);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9em;
    color: var(--accent);
  }
  .content pre {
    background: #0d1117;
    padding: 14px;
    border-radius: 6px;
    overflow-x: auto;
    border: 1px solid var(--border);
    margin: 12px 0;
  }
  .content pre code {
    background: transparent;
    padding: 0;
    color: #e6edf3;
  }
  .content .info-box {
    background: var(--bg-elev);
    border-left: 4px solid var(--blue);
    padding: 12px 16px;
    margin: 16px 0;
    border-radius: 4px;
  }
  .content .task-box {
    background: var(--bg-elev);
    border-left: 4px solid var(--accent);
    padding: 12px 16px;
    margin: 16px 0;
    border-radius: 4px;
  }

  .output-box {
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    min-height: 80px;
    max-height: 300px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .test-item {
    padding: 8px 12px;
    border-radius: 4px;
    margin: 6px 0;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .test-pass { background: rgba(172, 209, 87, 0.1); border-left: 3px solid var(--green); color: var(--green); }
  .test-fail { background: rgba(231, 24, 55, 0.1); border-left: 3px solid var(--red); color: var(--red); }

  .progress-bar {
    height: 6px;
    background: var(--bg-elev2);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    transition: width 0.3s;
  }

  .loader {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--bg-elev2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .fade-in { animation: fadeIn 0.3s ease-in; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .sidebar-toggle {
    display: none;
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 50;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 4px;
    cursor: pointer;
  }
  @media (max-width: 900px) {
    .sidebar-toggle { display: block; }
    #sidebar {
      position: fixed;
      top: 0; left: 0;
      height: 100vh;
      z-index: 40;
      transform: translateX(-100%);
      transition: transform 0.3s;
    }
    #sidebar.open { transform: translateX(0); }
    #main { padding-left: 0 !important; }
  }
</style>
</head>
<body>

<button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Меню</button>

<div class="flex min-h-screen">
  <!-- Sidebar -->
  <aside id="sidebar" class="w-72 border-r border-[#3b3b4f] bg-[#1b1b32] flex flex-col" style="min-width: 288px;">
    <div class="p-5 border-b border-[#3b3b4f]">
      <div class="flex items-center gap-2 mb-3">
        <div class="w-8 h-8 rounded bg-[#f1be32] flex items-center justify-center font-bold text-[#0a0a0a]">Py</div>
        <div>
          <div class="font-bold text-[15px]">PyCodeCamp</div>
          <div class="text-xs text-[#acacac]">Полный курс Python</div>
        </div>
      </div>
      <div class="text-xs text-[#acacac] mb-2">Прогресс: <span id="progressText">0/0</span></div>
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill" style="width: 0%"></div>
      </div>
    </div>
    <nav id="lessonList" class="flex-1 overflow-y-auto scrollbar p-3"></nav>
    <div class="p-4 border-t border-[#3b3b4f] text-xs text-[#acacac]">
      <button onclick="resetProgress()" class="text-[#acacac] hover:text-[#f1be32]">Сбросить прогресс</button>
    </div>
  </aside>

  <!-- Main -->
  <main id="main" class="flex-1 flex flex-col" style="padding-left: 0;">
    <div class="flex-1 overflow-y-auto scrollbar">
      <div id="content" class="content max-w-4xl mx-auto p-6 md:p-10 fade-in"></div>
    </div>

    <!-- Editor section -->
    <div class="border-t border-[#3b3b4f] bg-[#1b1b32]">
      <div class="max-w-5xl mx-auto p-4 md:p-6">
        <div class="flex items-center justify-between mb-3">
          <div class="text-sm font-bold text-[#f1be32]">✎ Редактор кода</div>
          <div class="flex gap-2">
            <button onclick="resetCode()" class="btn btn-secondary text-xs">Сбросить</button>
            <button id="runBtn" onclick="runCode()" class="btn btn-primary text-xs">▶ Запустить</button>
          </div>
        </div>
        <textarea id="editor" class="editor mono" spellcheck="false"></textarea>

        <div class="mt-4">
          <div class="text-sm font-bold mb-2 text-[#acacac]">Консоль вывода</div>
          <div id="output" class="output-box mono">Нажмите «Запустить» для выполнения кода...</div>
        </div>

        <div id="testsSection" class="mt-4 hidden">
          <div class="text-sm font-bold mb-2 text-[#acacac]">Проверка заданий</div>
          <div id="testsList"></div>
        </div>

        <div id="nextSection" class="mt-4 hidden">
          <button onclick="nextLesson()" class="btn btn-primary">Следующий урок →</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
// ============ LESSONS DATA ============
const LESSONS = [
  {
    id: 0,
    title: "Введение в Python",
    content: `
      <h1>Введение в Python</h1>
      <p>Python — это высокоуровневый язык программирования общего назначения, созданный Гвидо ван Россумом и выпущенный в 1991 году. Он известен своим чистым синтаксисом и читаемостью.</p>

      <h2>Почему Python?</h2>
      <ul>
        <li><strong>Простой синтаксис</strong> — код читается почти как английский текст</li>
        <li><strong>Огромное сообщество</strong> — миллионы разработчиков по всему миру</li>
        <li><strong>Универсальность</strong> — веб, наука о данных, AI, автоматизация, игры</li>
        <li><strong>Богатая экосистема</strong> — тысячи библиотек для любых задач</li>
      </ul>

      <h2>Ваша первая программа</h2>
      <p>Традиционно изучение любого языка начинается с программы, выводящей «Hello, World!». В Python это делается одной строкой:</p>
      <pre><code>print("Hello, World!")</code></pre>
      <p>Функция <code>print()</code> выводит текст в консоль. Текст (строка) заключается в кавычки — одинарные или двойные.</p>

      <div class="info-box">💡 <strong>Совет:</strong> Python чувствителен к регистру. <code>Print</code> и <code>print</code> — это разные вещи.</div>

      <h3>Комментарии</h3>
      <p>Комментарии — пояснения в коде, которые игнорируются интерпретатором:</p>
      <pre><code># Это однострочный комментарий
print("Привет")  # Комментарий после кода

"""
Это
многострочный
комментарий
"""</code></pre>

      <div class="task-box">
        <strong>📝 Задание:</strong> Выведите в консоль фразу <code>Hello, Python!</code>

    `,
    starterCode: `# Выведите "Hello, Python!"\n`,
    tests: [
      { name: "Программа выводит 'Hello, Python!'", code: `assert "Hello, Python!" in _output` }
    ]
  },
  {
    id: 1,
    title: "Переменные и типы данных",
    content: `
      <h1>Переменные и типы данных</h1>
      <p>Переменная — это именованная ячейка памяти, хранящая значение. В Python не нужно указывать тип переменной — он определяется автоматически.</p>

      <h2>Создание переменных</h2>
      <pre><code>name = "Алиса"
age = 25
height = 1.68
is_student = True

print(name)     # Алиса
print(age)      # 25</code></pre>

      <h2>Основные типы данных</h2>
      <ul>
        <li><code>int</code> — целые числа: <code>42</code>, <code>-7</code>, <code>0</code></li>
        <li><code>float</code> — дробные числа: <code>3.14</code>, <code>-0.5</code></li>
        <li><code>str</code> — строки: <code>"привет"</code>, <code>'мир'</code></li>
        <li><code>bool</code> — логический тип: <code>True</code> или <code>False</code></li>
        <li><code>NoneType</code> — отсутствие значения: <code>None</code></li>
      </ul>

      <h2>Определение типа</h2>
      <p>Функция <code>type()</code> возвращает тип объекта:</p>
      <pre><code>x = 42
print(type(x))  # &lt;class 'int'&gt;

y = "hello"
print(type(y))  # &lt;class 'str'&gt;</code></pre>

      <h2>Преобразование типов</h2>
      <pre><code>x = "10"
y = int(x)      # преобразование в число
z = float(x)    # в дробное число
w = str(y)      # в строку

print(y + 5)    # 15</code></pre>

      <h2>Имена переменных</h2>
      <ul>
        <li>Могут содержать буквы, цифры, символ подчёркивания</li>
        <li>Не могут начинаться с цифры</li>
        <li>Регистрозависимые: <code>name</code> и <code>Name</code> — разные переменные</li>
        <li>Нельзя использовать зарезервированные слова (<code>if</code>, <code>for</code>, <code>class</code> и т.д.)</li>
      </ul>

      <div class="task-box">
        <strong>📝 Задание:</strong> Создайте переменную <code>name</code> со значением <code>"Python"</code> и переменную <code>version</code> со значением <code>3</code>. Выведите их через пробел с помощью <code>print(name, version)</code>.
      </div>
    `,
    starterCode: `# Создайте переменные name и version\n# Выведите их через пробел\n`,
    tests: [
      { name: "Переменная name равна 'Python'", code: `assert name == "Python"` },
      { name: "Переменная version равна 3", code: `assert version == 3` },
      { name: "Вывод содержит 'Python 3'", code: `assert "Python 3" in _output` }
    ]
  },
  {
    id: 2,
    title: "Операторы и выражения",
    content: `
      <h1>Операторы и выражения</h1>
      <p>Операторы — это специальные символы, выполняющие операции над значениями (операндами).</p>

      <h2>Арифметические операторы</h2>
      <pre><code>a = 10
b = 3

print(a + b)   # 13  — сложение
print(a - b)   # 7   — вычитание

print(a / b)   # 3.333... — деление

print(x <= 4)   # False — меньше или равно</code></pre>

      <h2>Логические операторы</h2>

b = False

print(a and b)  # False — И
print(a or b)   # True  — ИЛИ
print(not a)    # False — НЕ</code></pre>

      <h2>Операторы присваивания</h2>
      <pre><code>x = 10
x += 5   # x = x + 5  → 15

      <h1>Строки</h1>
      <p>Строка (<code>str</code>) — это последовательность символов. Строки в Python неизменяемы.</p>

      <h2>Создание строк</h2>

s2 = 'Мир'

      <h2>Операции со строками</h2>

      <h2>Индексация и срезы</h2>
      <pre><code>s = "Python"

      <h2>Методы строк</h2>

    content: `
      <h1>Условные конструкции</h1>
      <p>Условные операторы позволяют выполнять разный код в зависимости от условий.</p>

      <pre><code>class Counter:

        <li><code>\\S</code> — не пробельный</li>

      <pre><code>*   — 0 или более раз
+   — 1 или более раз
?   — 0 или 1 раз
{n} — ровно n раз
{n,} — n или более
{n,m} — от n до m</code></pre>

      <h2>Группы</h2>
      <pre><code>pattern = r"(\\d{4})-(\\d{2})-(\\d{2})"
match = re.search(pattern, "Дата: 2024-03-15")
if match:
    print(match.group(0))  # вся строка: 2024-03-15
    print(match.group(1))  # 2024
    print(match.group(2))  # 03
    print(match.group(3))  # 15
    print(match.groups())  # ('2024', '03', '15')</code></pre>

      <h2>Наборы символов</h2>

[a-z]     — любая строчная латинская
[0-9]     — любая цифра
[^abc]    — НЕ a, b или c</code></pre>

# Валидация телефона

// ============ STATE ============
let currentLesson = 0;
let completedLessons = new Set();
let pyodide = null;
let pyodideReady = false;

// Load state
try {
  const saved = JSON.parse(localStorage.getItem("pycodecamp_progress") || "[]");
  completedLessons = new Set(saved);
  const savedLesson = parseInt(localStorage.getItem("pycodecamp_current") || "0");
  if (savedLesson >= 0 && savedLesson < LESSONS.length) currentLesson = savedLesson;
} catch(e) {}

// ============ PYODIDE ============
async function initPyodide() {
  try {
    pyodide = await loadPyodide();
    pyodideReady = true;
    console.log("Pyodide ready");
  } catch(e) {
    console.error("Pyodide load error:", e);
    setOutput("❌ Ошибка загрузки Python. Обновите страницу.");
  }
}
initPyodide();

// ============ RENDER ============
function renderSidebar() {
  const list = document.getElementById("lessonList");
  list.innerHTML = "";
  LESSONS.forEach((lesson, idx) => {
    const btn = document.createElement("button");
    btn.className = "lesson-btn";
    if (idx === currentLesson) btn.classList.add("active");
    if (completedLessons.has(idx)) btn.classList.add("completed");
    btn.innerHTML = `<span style="flex:1">${idx + 1}. ${lesson.title}</span>`;
    btn.onclick = () => loadLesson(idx);
    list.appendChild(btn);
  });
  updateProgress();
}

function updateProgress() {
  const total = LESSONS.length;
  const done = completedLessons.size;
  document.getElementById("progressText").textContent = `${done}/${total}`;
  document.getElementById("progressFill").style.width = `${(done/total)*100}%`;
}

function loadLesson(idx) {
  currentLesson = idx;
  localStorage.setItem("pycodecamp_current", idx);
  const lesson = LESSONS[idx];
  document.getElementById("content").innerHTML = lesson.content;
  document.getElementById("content").classList.remove("fade-in");
  void document.getElementById("content").offsetWidth;
  document.getElementById("content").classList.add("fade-in");

  // Load saved code or starter
  const savedCode = localStorage.getItem(`pycodecamp_code_${idx}`);
  document.getElementById("editor").value = savedCode !== null ? savedCode : lesson.starterCode;

  document.getElementById("output").textContent = "Нажмите «Запустить» для выполнения кода...";
  document.getElementById("testsSection").classList.add("hidden");
  document.getElementById("nextSection").classList.add("hidden");

  renderSidebar();
  // Scroll to top
  document.querySelector("main").scrollTo(0, 0);
  // Close mobile sidebar
  document.getElementById("sidebar").classList.remove("open");
}

function setOutput(text) {
  document.getElementById("output").textContent = text;
}

function resetCode() {
  document.getElementById("editor").value = LESSONS[currentLesson].starterCode;
  localStorage.removeItem(`pycodecamp_code_${currentLesson}`);
}

function nextLesson() {
  if (currentLesson < LESSONS.length - 1) {
    loadLesson(currentLesson + 1);
  }
}

function resetProgress() {
  if (confirm("Сбросить весь прогресс?")) {
    completedLessons.clear();
    localStorage.removeItem("pycodecamp_progress");
    for (let i = 0; i < LESSONS.length; i++) {
      localStorage.removeItem(`pycodecamp_code_${i}`);
    }
    loadLesson(0);
  }
}

// Save code on edit
document.getElementById("editor").addEventListener("input", (e) => {
  localStorage.setItem(`pycodecamp_code_${currentLesson}`, e.target.value);
});

// Handle Tab key in editor
document.getElementById("editor").addEventListener("keydown", (e) => {
  if (e.key === "Tab") {
    e.preventDefault();
    const ta = e.target;
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    ta.value = ta.value.substring(0, start) + "    " + ta.value.substring(end);
    ta.selectionStart = ta.selectionEnd = start + 4;
  }
});

// ============ RUN CODE ============
async function runCode() {
  const code = document.getElementById("editor").value;
  const runBtn = document.getElementById("runBtn");
  const output = document.getElementById("output");

  if (!pyodideReady) {
    output.textContent = "⏳ Python загружается, подождите...";
    return;
  }

  runBtn.disabled = true;
  runBtn.innerHTML = '<span class="loader"></span> Выполняется...';
  output.textContent = "";

  try {
    // Capture stdout
    pyodide.runPython(`
import sys
from io import StringIO
_sys_out = StringIO()
_sys_err = StringIO()
sys.stdout = _sys_out
sys.stderr = _sys_err
    `);

    // Store source for tests
    pyodide.globals.set("_source", code);

    // Run user code
    await pyodide.runPythonAsync(code);

    // Get output
    const stdout = pyodide.runPython("_sys_out.getvalue()");
    const stderr = pyodide.runPython("_sys_err.getvalue()");

    pyodide.globals.set("_output", stdout);

    // Restore stdout
    pyodide.runPython(`
sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
    `);

    let display = stdout || "(нет вывода)";
    if (stderr) display += "\n\n⚠️ Предупреждения:\n" + stderr;
    output.textContent = display;

    // Run tests
    runTests(code);

  } catch(e) {
    pyodide.runPython(`
import sys
sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
    `);
    output.textContent = "❌ Ошибка:\n" + e.message;
    document.getElementById("testsSection").classList.remove("hidden");
    document.getElementById("testsList").innerHTML = `
      <div class="test-item test-fail">⚠ Ошибка выполнения. Проверьте код.</div>
    `;
    document.getElementById("nextSection").classList.add("hidden");
  } finally {
    runBtn.disabled = false;
    runBtn.innerHTML = "▶ Запустить";
  }
}

async function runTests(userCode) {
  const lesson = LESSONS[currentLesson];
  const testsSection = document.getElementById("testsSection");
  const testsList = document.getElementById("testsList");
  const nextSection = document.getElementById("nextSection");

  testsSection.classList.remove("hidden");
  testsList.innerHTML = "";

  let allPassed = true;

  for (const test of lesson.tests) {
    const div = document.createElement("div");
    div.className = "test-item";

    try {
      // Run test code in same environment
      await pyodide.runPythonAsync(test.code);
      div.className = "test-item test-pass";
      div.innerHTML = `<span>✓</span> ${test.name}`;
    } catch(e) {
      div.className = "test-item test-fail";
      div.innerHTML = `<span>✗</span> ${test.name}`;
      allPassed = false;
    }
    testsList.appendChild(div);
  }

  if (allPassed) {
    completedLessons.add(currentLesson);
    localStorage.setItem("pycodecamp_progress", JSON.stringify([...completedLessons]));
    renderSidebar();

    const congrats = document.createElement("div");
    congrats.className = "test-item test-pass";
    congrats.style.marginTop = "12px";
    congrats.style.fontWeight = "bold";
    congrats.innerHTML = "🎉 Все тесты пройдены! Урок завершён.";
    testsList.appendChild(congrats);

    if (currentLesson < LESSONS.length - 1) {
      nextSection.classList.remove("hidden");
    } else {
      const finish = document.createElement("div");
      finish.className = "test-item test-pass";
      finish.style.marginTop = "12px";
      finish.style.fontWeight = "bold";
      finish.style.fontSize = "16px";
      finish.innerHTML = "🏆 Вы прошли весь курс PyCodeCamp! Поздравляем!";
      testsList.appendChild(finish);
    }
  }
}

// ============ INIT ============
loadLesson(currentLesson);
</script>
