<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pythonCamp — полный курс Python</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css" />
  <style>
    :root {
      --bg: #0a0a23;
      --bg-2: #1b1b32;
      --bg-3: #2a2a40;
      --yellow: #f1be32;
      --yellow-2: #ffbf3f;
      --text: #f5f6f7;
      --muted: #d0d0d5;
      --ok: #4caf50;
      --err: #ff4d4f;
      --blue: #99c9ff;
      --border: #3b3b4f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Lato, sans-serif; }
    a { color: var(--blue); }
    button { font-family: inherit; cursor: pointer; }
    code, .mono { font-family: "Roboto Mono", monospace; }
    #app { min-height: 100%; display: flex; flex-direction: column; }

    .nav {
      height: 52px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; background: var(--bg); border-bottom: 1px solid var(--border); gap: 12px;
      position: sticky; top: 0; z-index: 20;
    }
    .logo { color: var(--yellow); font-weight: 700; font-size: 20px; letter-spacing: .3px; background: none; border: 0; }
    .logo span { color: #fff; }
    .nav-right, .nav-left { display: flex; align-items: center; gap: 10px; }
    .pill {
      background: var(--bg-2); color: var(--muted); border: 1px solid var(--border);
      border-radius: 20px; padding: 6px 12px; font-size: 13px;
    }
    .btn {
      border: 0; border-radius: 0; padding: 10px 16px; font-weight: 700; font-size: 15px;
    }
    .btn-yellow { background: var(--yellow); color: #0a0a23; }
    .btn-yellow:hover { background: var(--yellow-2); }
    .btn-ghost { background: transparent; color: #fff; border: 2px solid #fff; }
    .btn-dark { background: var(--bg-3); color: #fff; border: 1px solid var(--border); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }

    .map-wrap { max-width: 860px; margin: 0 auto; padding: 36px 16px 80px; }
    .hero h1 { font-size: 34px; margin: 0 0 8px; }
    .hero p { color: var(--muted); margin: 0 0 28px; line-height: 1.5; }
    .progress-wide { height: 8px; background: var(--bg-3); border-radius: 8px; overflow: hidden; margin: 12px 0 28px; }
    .progress-wide > div { height: 100%; background: var(--yellow); width: 0; transition: width .3s; }

    .section-block { margin: 0 0 42px; }
    .section-head {
      display: flex; align-items: center; gap: 12px; background: var(--bg-2);
      padding: 14px 18px; border-radius: 0; margin-bottom: 8px;
    }
    .badge { width: 42px; height: 42px; border: 4px solid var(--yellow); border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: var(--yellow); }
    .badge.done { background: var(--yellow); color: #0a0a23; }
    .section-head h2 { margin: 0; font-size: 20px; }
    .section-head small { color: var(--muted); }

    .lesson-row {
      display: flex; align-items: center; gap: 14px; padding: 10px 18px 10px 28px;
      color: var(--muted); background: none; border: 0; width: 100%; text-align: left; font-size: 16px;
    }
    .lesson-row:hover { background: #111133; color: #fff; }
    .dot {
      width: 16px; height: 16px; border: 3px solid #5a5a72; border-radius: 50%; flex-shrink: 0;
    }
    .dot.done { border-color: var(--ok); background: var(--ok); }
    .dot.project { border-radius: 3px; }
    .rail { width: 3px; background: #3b3b4f; margin-left: 48px; height: 8px; }

    .lesson-layout { display: grid; grid-template-columns: minmax(320px, 42%) 1fr; flex: 1; min-height: 0; }
    .instr { background: var(--bg-2); padding: 22px 22px 80px; overflow: auto; border-right: 1px solid var(--border); }
    .instr h1 { font-size: 24px; margin: 0 0 14px; }
    .instr p, .instr li { line-height: 1.6; color: var(--muted); }
    .instr pre, .console, .hint-box {
      background: #0a0a23; border: 1px solid var(--border); padding: 12px; overflow: auto;
      font-family: "Roboto Mono", monospace; font-size: 13px; color: #f5f6f7;
    }
    .instr code { background: #0a0a23; padding: 1px 6px; color: var(--yellow); }
    .editor-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .editor-tools { display: flex; gap: 8px; padding: 8px; background: var(--bg); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .CodeMirror { flex: 1; height: auto; font-size: 15px; font-family: "Roboto Mono", monospace; }
    .bottom-panes { height: 220px; display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--border); }
    .pane { display: flex; flex-direction: column; min-width: 0; }
    .pane h3 { margin: 0; padding: 8px 12px; font-size: 13px; background: #111133; color: var(--muted); letter-spacing: .4px; text-transform: uppercase; }
    .console { flex: 1; margin: 0; border: 0; white-space: pre-wrap; }
    .tests { flex: 1; overflow: auto; padding: 8px 12px; background: #0a0a23; }
    .test { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; font-size: 14px; color: var(--muted); }
    .test .mark { width: 18px; flex-shrink: 0; }
    .test.pass { color: var(--ok); }
    .test.fail { color: var(--err); }
    .footer-bar {
      display: flex; justify-content: space-between; align-items: center; padding: 10px 12px;
      background: var(--bg-2); border-top: 1px solid var(--border); gap: 8px; flex-wrap: wrap;
    }

    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: grid; place-items: center; z-index: 50; }
    .modal { background: var(--bg-2); padding: 28px; width: min(520px, 92vw); border: 1px solid var(--border); }
    .modal input { width: 100%; padding: 10px; background: #0a0a23; color: #fff; border: 1px solid var(--border); font-size: 16px; }
    .cert {
      max-width: 820px; margin: 40px auto; background: #fff; color: #0a0a23; padding: 48px; text-align: center;
    }
    .cert h2 { font-size: 32px; margin: 8px 0; }
    .loader { display: grid; place-items: center; min-height: calc(100vh - 52px); text-align: center; }
    .spin { width: 42px; height: 42px; border: 4px solid #3b3b4f; border-top-color: var(--yellow); border-radius: 50%; animation: sp .8s linear infinite; margin: 0 auto 16px; }
    @keyframes sp { to { transform: rotate(360deg); } }
    @media (max-width: 900px) {
      .lesson-layout, .bottom-panes { grid-template-columns: 1fr; }
      .bottom-panes { height: auto; }
      .CodeMirror { min-height: 280px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <script>
const LS_DONE = "pythoncamp-done";
const LS_CODE = "pythoncamp-code";
const LS_NAME = "pythoncamp-name";

function L(id, title, theory, starter, tests, extra = {}) {
  return { id, title, theory, starter, tests, ...extra };
}
const py = (desc, code) => ({ desc, type: "py", value: code });
const out = (desc, value) => ({ desc, type: "stdoutHas", value });
const exact = (desc, value) => ({ desc, type: "stdoutExact", value });
const has = (desc, value) => ({ desc, type: "codeHas", value });
const noHas = (desc, value) => ({ desc, type: "codeNot", value });
const re = (desc, value) => ({ desc, type: "codeRe", value });

const SECTIONS = [
  {
    id: "intro",
    title: "Основы Python",
    blurb: "Синтаксис, вывод, переменные и типы.",
    lessons: [
      L("hello", "Hello, World!", `
        <p>Python — язык общего назначения. Первая программа почти всегда выводит текст.</p>
        <p>Функция <code>print()</code> печатает значение в консоль. Строки пишут в кавычках:</p>
        <pre>print("Hello, World!")</pre>
        <p>Напечатайте ровно <code>Hello, World!</code></p>`,
        '# Используй print\n',
        [has("Есть вызов print", "print"), out("В выводе есть Hello, World!", "Hello, World!")]),
      L("comments", "Комментарии", `
        <p>Комментарий начинается с <code>#</code> и игнорируется интерпретатором. Им объясняют код.</p>
        <pre># это комментарий\nprint("ok")</pre>
        <p>Добавьте комментарий, в котором есть слово <code>TODO</code>, и напечатайте <code>ready</code>.</p>`,
        'print("ready")\n',
        [has("Есть комментарий", "#"), has("В комментарии есть TODO", "TODO"), exact("Вывод ready", "ready")]),
      L("vars", "Переменные", `
        <p>Имя переменной связывается со значением через <code>=</code>. Имена: буквы, цифры, <code>_</code>, нельзя начинать с цифры.</p>
        <pre>name = "Ada"\nprint(name)</pre>
        <p>Создайте переменную <code>language</code> со значением <code>"Python"</code> и напечатайте её.</p>`,
        '',
        [re("Есть переменная language", "language\\s*="), out("Печатается Python", "Python")]),
      L("types", "Типы данных", `
        <p>Базовые типы: <code>int</code>, <code>float</code>, <code>str</code>, <code>bool</code>. Тип смотрят через <code>type(x)</code>.</p>
        <pre>print(type(3))\nprint(type(3.14))\nprint(type("hi"))</pre>
        <p>Объявите <code>age = 18</code>, <code>height = 1.7</code>, <code>active = True</code>. Напечатайте <code>type(age)</code>.</p>`,
        '',
        [has("age", "age"), has("height", "height"), has("active", "active"), out("Печатается класс int", "int")]),
      L("multi-assign", "Множественное присваивание", `
        <p>Можно писать <code>a, b = 1, 2</code>. Так удобно менять местами: <code>a, b = b, a</code>.</p>
        <p>Задайте <code>x, y = 10, 20</code>, поменяйте их местами и напечатайте <code>x</code>, затем <code>y</code> (каждое с новой строки).</p>`,
        'x, y = 10, 20\n',
        [py("x стал 20", "assert x == 20"), py("y стал 10", "assert y == 10"), exact("Вывод 20 затем 10", "20\\n10")]),
      L("casting", "Преобразование типов", `
        <p><code>int("5")</code> → 5, <code>str(5)</code> → <code>"5"</code>, <code>float("2")</code> → 2.0.</p>
        <p>Дана строка <code>n = "42"</code>. Преобразуйте её в целое, прибавьте 8 и напечатайте результат.</p>`,
        'n = "42"\n',
        [has("int(", "int("), exact("Печатается 50", "50")]),
      L("bools", "Булевы значения", `
        <p><code>True</code> и <code>False</code> — логический тип. Их дают сравнения: <code>3 > 1</code>, <code>2 == 2</code>, <code>2 != 3</code>.</p>
        <p>Напечатайте результаты <code>5 > 2</code>, <code>5 == 2</code> и <code>5 != 2</code> — каждое с новой строки.</p>`,
        '',
        [exact("Вывод True / False / True", "True\\nFalse\\nTrue")]),
      L("input-sim", "Ввод: input()", `
        <p><code>input(prompt)</code> читает строку. В этом курсе ввод подставляется автоматически.</p>
        <p>Считайте имя через <code>input()</code> и напечатайте <code>Hello, {имя}!</code></p>
        <p>Для проверки программе будет передано имя <code>Ada</code>.</p>`,
        'name = input()\n',
        [has("input", "input"), out("Приветствие для Ada", "Hello, Ada!")],
        { inputs: ["Ada"] }),
      L("sep-end", "Параметры sep и end", `
        <p><code>print(a, b, sep="-")</code> ставит разделитель. <code>end=""</code> убирает перевод строки.</p>
        <p>Напечатайте <code>2026-10-11</code> одним <code>print</code> из чисел 2026, 10 и 11.</p>`,
        '',
        [has("sep", "sep"), out("Дата через дефис", "2026-10-11")]),
      L("proj-card", "Проект: визитка", `
        <p>Соберите карточку. Переменные: <code>name</code>, <code>role</code>, <code>city</code>. Напечатайте три строки:</p>
        <pre>Name: ...\nRole: ...\nCity: ...</pre>
        <p>Используйте свои данные, но метки <code>Name:</code>, <code>Role:</code>, <code>City:</code> обязательны.</p>`,
        'name = ""\nrole = ""\ncity = ""\n',
        [has("name", "name"), has("role", "role"), has("city", "city"), out("Есть Name:", "Name:"), out("Есть Role:", "Role:"), out("Есть City:", "City:")],
        { project: true })
    ]
  },
  {
    id: "ops",
    title: "Числа и операторы",
    blurb: "Арифметика, приоритет и модуль.",
    lessons: [
      L("arith", "Арифметика", `
        <p>Операторы: <code>+</code> <code>-</code> <code>*</code> <code>/</code> (всегда float) <code>//</code> (целая) <code>%</code> <code>**</code> (степень).</p>
        <p>Напечатайте <code>7 // 2</code>, <code>7 % 2</code> и <code>2 ** 8</code> с новых строк.</p>`,
        '',
        [exact("7//2, 7%2, 2**8", "3\\n1\\n256")]),
      L("priority", "Приоритет", `
        <p>Сначала степень, затем умножение/деление, затем сложение. Скобки меняют порядок: <code>(1+2)*3</code>.</p>
        <p>Вычислите и напечатайте <code>(3 + 5) * 2 ** 2 - 6 / 2</code>. Ожидается <code>29.0</code>.</p>`,
        '',
        [out("Результат 29.0", "29.0")]),
      L("augassign", "Сокращённые операторы", `
        <p><code>x += 1</code> то же, что <code>x = x + 1</code>. Есть <code>-=</code>, <code>*=</code>, <code>/=</code>.</p>
        <p>Начните с <code>score = 10</code>, добавьте 5, умножьте на 2, напечатайте <code>score</code>.</p>`,
        'score = 10\n',
        [has("+=", "+="), has("*=", "*="), exact("score равен 30", "30")]),
      L("round-abs", "round, abs, pow", `
        <p><code>abs(-3)</code> → 3. <code>round(3.14159, 2)</code> → 3.14. <code>pow(2, 5)</code> → 32.</p>
        <p>Напечатайте <code>abs(-12)</code>, <code>round(2.718, 2)</code> и <code>pow(3, 4)</code>.</p>`,
        '',
        [out("12", "12"), out("2.72", "2.72"), out("81", "81")]),
      L("divmod", "divmod", `
        <p><code>divmod(a, b)</code> возвращает пару <code>(a // b, a % b)</code>.</p>
        <p>Для 100 минут напечатайте часы и минуты: <code>hours, minutes = divmod(100, 60)</code> и оба значения.</p>`,
        '',
        [has("divmod", "divmod"), out("1 час", "1"), out("40 минут", "40")]),
      L("math-mod", "Модуль math", `
        <p>Стандартная библиотека: <code>import math</code>. Часто берут <code>math.pi</code>, <code>math.sqrt</code>, <code>math.floor</code>.</p>
        <p>Напечатайте целую часть корня из 20: <code>math.floor(math.sqrt(20))</code>.</p>`,
        'import math\n',
        [has("import math", "import math"), exact("floor(sqrt(20)) = 4", "4")]),
      L("cmp-chain", "Цепочки сравнений", `
        <p>В Python можно писать <code>1 < x < 10</code> — это «x между 1 и 10».</p>
        <p>Для <code>x = 7</code> напечатайте результат <code>1 < x < 10</code> и <code>x == 7</code>.</p>`,
        'x = 7\n',
        [exact("True и True", "True\\nTrue")]),
      L("proj-temp", "Проект: цельсий → фаренгейт", `
        <p>Формула: <code>F = C * 9 / 5 + 32</code>.</p>
        <p>Напишите функцию <code>to_fahrenheit(c)</code>, которая возвращает температуру в °F. Для 0 должно быть 32, для 100 — 212.</p>`,
        'def to_fahrenheit(c):\n    pass\n',
        [has("def to_fahrenheit", "def to_fahrenheit"), py("0°C = 32°F", "assert to_fahrenheit(0) == 32"), py("100°C = 212°F", "assert to_fahrenheit(100) == 212"), py("25°C = 77°F", "assert to_fahrenheit(25) == 77")],
        { project: true })
    ]
  },
  {
    id: "str",
    title: "Строки",
    blurb: "Индексация, срезы и методы str.",
    lessons: [
      L("str-index", "Индексация", `
        <p>Строка — последовательность символов. <code>s[0]</code> — первый, <code>s[-1]</code> — последний.</p>
        <pre>s = "Python"\nprint(s[0], s[-1])</pre>
        <p>Для <code>word = "algorithm"</code> напечатайте первый и последний символы без пробела между ними.</p>`,
        'word = "algorithm"\n',
        [out("am", "am")]),
      L("str-slice", "Срезы", `
        <p><code>s[start:stop]</code> не включает stop. <code>s[:3]</code> — первые три, <code>s[::-1]</code> — переворот.</p>
        <p>Для <code>s = "freeCodeCamp"</code> напечатайте <code>Camp</code> срезом и перевёрнутую строку на второй строке.</p>`,
        's = "freeCodeCamp"\n',
        [has(":", ":"), out("Camp", "Camp"), out("переворот", "pmaCedoCeerf")]),
      L("str-len", "len и конкатенация", `
        <p><code>len(s)</code> — длина. Строки склеивают <code>+</code> или повторяют <code>*</code>.</p>
        <p>Для <code>a = "py"</code> напечатайте <code>a * 3</code> и длину <code>"Python"</code>.</p>`,
        'a = "py"\n',
        [out("pypypy", "pypypy"), out("6", "6")]),
      L("f-strings", "f-строки", `
        <p>Форматирование: <code>f"Hello, {name}!"</code>. Выражения тоже можно: <code>f"{2+2}"</code>.</p>
        <p>Дано <code>lang = "Python"</code>, <code>year = 1991</code>. Напечатайте <code>Python was created in 1991</code> через f-строку.</p>`,
        'lang = "Python"\nyear = 1991\n',
        [has("f-строка", 'f"'), exact("Нужный текст", "Python was created in 1991")]),
      L("methods-case", "Регистр", `
        <p>Методы: <code>upper()</code>, <code>lower()</code>, <code>title()</code>, <code>swapcase()</code>.</p>
        <p>Для <code>s = "pYtHoN"</code> напечатайте lower, upper и title — по строке на каждый.</p>`,
        's = "pYtHoN"\n',
        [exact("три регистра", "python\\nPYTHON\\nPython")]),
      L("strip-replace", "strip и replace", `
        <p><code>strip()</code> убирает пробелы по краям. <code>replace(old, new)</code> заменяет подстроки.</p>
        <p>Для <code>s = "  foo bar  "</code> уберите края и замените пробел на дефис. Напечатайте результат.</p>`,
        's = "  foo bar  "\n',
        [exact("foo-bar", "foo-bar")]),
      L("split-join", "split и join", `
        <p><code>"a,b,c".split(",")</code> → список. <code>"-".join(["a","b"])</code> → <code>"a-b"</code>.</p>
        <p>Разбейте <code>"red green blue"</code> по пробелу и склейте через запятую без пробелов: <code>red,green,blue</code>.</p>`,
        's = "red green blue"\n',
        [has("split", "split"), has("join", "join"), exact("red,green,blue", "red,green,blue")]),
      L("in-find", "in, find, count", `
        <p><code>"py" in "python"</code> → True. <code>s.find("x")</code> индекс или -1. <code>s.count("a")</code> — сколько раз.</p>
        <p>Для <code>s = "banana"</code> напечатайте, есть ли <code>"ana"</code>, затем <code>count("a")</code>.</p>`,
        's = "banana"\n',
        [out("True", "True"), out("3", "3")]),
      L("is-methods", "Проверки символов", `
        <p><code>isdigit()</code>, <code>isalpha()</code>, <code>isalnum()</code>, <code>isspace()</code> возвращают bool.</p>
        <p>Напечатайте <code>"42".isdigit()</code>, <code>"hi".isalpha()</code>, <code>"hi42".isalnum()</code>.</p>`,
        '',
        [exact("три True", "True\\nTrue\\nTrue")]),
      L("proj-cipher", "Проект: шифр Цезаря (сдвиг 1)", `
        <p>Напишите <code>shift_one(text)</code>: каждый латинский символ сдвигается на +1, <code>z</code> → <code>a</code>, регистр сохраняется, остальное без изменений.</p>

        <p>Функции <code>add</code>, <code>sub</code>, <code>mul</code>, <code>div</code> (деление на 0 → ValueError) и <code>calculate(a, op, b)</code>, где op — один из <code>+ - * /</code>.</p>`,
        'def add(a, b):\n    pass\n\ndef sub(a, b):\n    pass\n\ndef mul(a, b):\n    pass\n\ndef div(a, b):\n    pass\n\ndef calculate(a, op, b):\n    pass\n',
        [py("ops", "assert add(2,3)==5 and sub(5,1)==4 and mul(3,3)==9 and div(8,2)==4"), py("calculate", "assert calculate(10,'*',2)==20"), py("div0", "try:\\n div(1,0); raise AssertionError\\nexcept ValueError:\\n pass")],
        { project: true }),
      L("proj-hangman", "Логика Hangman", `
        <p><code>mask(secret, guessed)</code> — строка той же длины: открытые буквы (регистр как в secret), неизвестные — <code>_</code>.</p>
        <p><code>won(secret, guessed)</code> — все буквы secret (без учёта регистра) есть в множестве guessed.</p>`,
        'def mask(secret, guessed):\n    pass\n\ndef won(secret, guessed):\n    pass\n',
        [py("маска", "assert mask('Python', {'p','o'})=='P____o' or mask('Python', {'p','o'})=='P_t__o' or True"), py("маска точнее", "assert mask('cat', {'a'})=='_a_'"), py("победа", "assert won('cat', {'c','a','t'}) is True"), py("ещё нет", "assert won('cat', {'c'}) is False")],
        { project: true }),
      L("proj-ttt", "Победитель в крестиках-ноликах", `
        <p>Поле — список из 9 элементов: <code>"X"</code>, <code>"O"</code> или <code>" "</code>.</p>
        <p><code>winner(board)</code> возвращает <code>"X"</code>, <code>"O"</code> или <code>None</code>, если победителя нет.</p>`,
        'def winner(board):\n    pass\n',
        [py("ряд", "assert winner(['X','X','X',' ','O',' ',' ','O',' '])=='X'"), py("столбец", "assert winner(['O','X',' ','O','X',' ','O',' ','X'])=='O'"), py("диагональ", "assert winner(['X','O','O',' ','X',' ',' ','O','X'])=='X'"), py("никто", "assert winner(['X','O','X','X','O','O','O','X','X']) is None")],
        { project: true }),
      L("proj-students", "Журнал студентов", `
        <p>Класс <code>Student(name)</code> со списком <code>grades</code> и методами <code>add(g)</code>, <code>gpa()</code> (среднее, 0 если пусто).</p>
        <p>Класс <code>Group</code> с <code>students</code> и <code>top()</code> — студент с максимальным GPA (при равенстве — первый).</p>`,
        'class Student:\n    pass\n\nclass Group:\n    pass\n',
        [py("gpa", "s=Student('Ada'); s.add(5); s.add(3); assert s.gpa()==4"), py("top", "a=Student('A'); a.add(5); b=Student('B'); b.add(3); g=Group([a,b]); assert g.top().name=='A'")],
        { project: true }),
      L("proj-case", "Конвертер регистра", `
        <p>Как в freeCodeCamp: <code>to_camel(s)</code> из <code>snake_case</code> в camelCase, <code>to_snake(s)</code> наоборот.</p>
        <p><code>hello_world</code> → <code>helloWorld</code>, <code>helloWorld</code> → <code>hello_world</code>.</p>`,
        'def to_camel(s):\n    pass\n\ndef to_snake(s):\n    pass\n',
        [py("camel", "assert to_camel('hello_world')=='helloWorld'"), py("camel multi", "assert to_camel('get_http_response')=='getHttpResponse'"), py("snake", "assert to_snake('helloWorld')=='hello_world'"), py("snake HTTP", "assert to_snake('getHttpResponse')=='get_http_response'")],
        { project: true }),
      L("proj-final", "Финальный проект: Todo-движок", `
        <p>Класс <code>TodoList</code>:</p>
        <ul>
          <li><code>add(title)</code> — задача <code>{"title", "done": False}</code>, вернуть индекс</li>
          <li><code>complete(i)</code> — отметить done</li>
          <li><code>pending()</code> — список незавершённых title</li>
          <li><code>clear_done()</code> — удалить завершённые</li>
        </ul>`,
        'class TodoList:\n    def __init__(self):\n        self.items = []\n',
        [py("сценарий", "t=TodoList(); i=t.add('read'); t.add('code'); t.complete(i); assert t.pending()==['code']; t.clear_done(); assert len(t.items)==1 and t.items[0]['title']=='code'")],
        { project: true })
    ]
  }
];

const LESSONS = SECTIONS.flatMap((s) => s.lessons.map((l) => ({ ...l, sectionId: s.id })));
function lessonIndex(id) { return LESSONS.findIndex((l) => l.id === id); }

let pyodide = null;
let pyodideError = null;
let cm = null;
let view = "map";
let currentId = LESSONS[0].id;
let lastTests = [];
let lastStdout = "";
let lastError = "";
let busy = false;
let hintOn = false;
let showCert = false;
let showNameModal = !localStorage.getItem(LS_NAME);

function loadDone() {
  try { return new Set(JSON.parse(localStorage.getItem(LS_DONE) || "[]")); }
  catch { return new Set(); }
}
function saveDone(set) { localStorage.setItem(LS_DONE, JSON.stringify([...set])); }
function loadCodeMap() {
  try { return JSON.parse(localStorage.getItem(LS_CODE) || "{}"); }
  catch { return {}; }
}
function saveLessonCode(id, code) {
  const m = loadCodeMap(); m[id] = code; localStorage.setItem(LS_CODE, JSON.stringify(m));
}
function getName() { return localStorage.getItem(LS_NAME) || "Студент"; }

async function bootPy() {
  try {
    pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/" });
  } catch (e) {
    pyodideError = String(e);
  }
  render();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

async function runStudent(code, lesson) {
  if (!pyodide) throw new Error("Python ещё загружается");
  const inputs = JSON.stringify(lesson.inputs || []);
  const wrapper = `
import sys, io, traceback
_out = io.StringIO()
sys.stdout = _out
sys.stderr = _out
_inputs = iter(${inputs})
def input(prompt=""):
    if prompt:
        print(prompt, end="")
    try:
        return next(_inputs)
    except StopIteration:
        return ""
__error__ = None
try:
    exec(${JSON.stringify(code)}, globals())
except SystemExit:
    pass
except Exception:
    __error__ = traceback.format_exc()
__stdout__ = _out.getvalue()
`;
  await pyodide.runPythonAsync("for _k in list(globals()):\n    if _k not in ('__name__','__doc__','__package__','__loader__','__spec__','__builtins__'):\n        del globals()[_k]");
  await pyodide.runPythonAsync(wrapper);
  const stdout = pyodide.globals.get("__stdout__") || "";
  const error = pyodide.globals.get("__error__");
  return { stdout, error: error || "" };
}

async function evalPy(expr) {
  try {
    await pyodide.runPythonAsync(expr);
    return { ok: true, err: "" };
  } catch (e) {
    return { ok: false, err: String(e) };
  }
}

async function checkLesson() {
  const lesson = LESSONS[lessonIndex(currentId)];
  const code = cm ? cm.getValue() : "";
  saveLessonCode(lesson.id, code);
  busy = true; lastError = ""; lastStdout = ""; lastTests = lesson.tests.map((t) => ({ ...t, status: "run" }));
  render(true);
  try {
    const { stdout, error } = await runStudent(code, lesson);
    lastStdout = stdout;
    lastError = error;
    const results = [];
    for (const t of lesson.tests) {
      let pass = false;
      let detail = "";
      if (error && t.type !== "codeHas" && t.type !== "codeNot" && t.type !== "codeRe") {
        pass = false; detail = "Код упал с ошибкой";
      } else if (t.type === "stdoutHas") {
        pass = t.value === "" ? true : stdout.includes(t.value);
      } else if (t.type === "stdoutExact") {
        const want = t.value.replace(/\\n/g, "\n").replace(/\n$/, "");
        pass = stdout.replace(/\r/g, "").trim() === want;
      } else if (t.type === "codeHas") {
        pass = code.includes(t.value);
      } else if (t.type === "codeNot") {
        pass = !code.includes(t.value);
      } else if (t.type === "codeRe") {
        pass = new RegExp(t.value).test(code);
      } else if (t.type === "py") {
        if (error) { pass = false; detail = "Код упал с ошибкой"; }
        else {
          const r = await evalPy(t.value);
          pass = r.ok;
          if (!r.ok) detail = r.err.split("\n").filter(Boolean).pop() || r.err;
        }
      }
      results.push({ ...t, status: pass ? "pass" : "fail", detail });
    }
    lastTests = results;
    if (results.every((x) => x.status === "pass")) {
      const done = loadDone();
      done.add(lesson.id);
      saveDone(done);
    }
  } catch (e) {
    lastError = String(e);
    lastTests = lesson.tests.map((t) => ({ ...t, status: "fail", detail: String(e) }));
  }
  busy = false;
  render(true);
}

async function runOnly() {
  const lesson = LESSONS[lessonIndex(currentId)];
  const code = cm.getValue();
  saveLessonCode(lesson.id, code);
  busy = true; render(true);
  try {
    const { stdout, error } = await runStudent(code, lesson);
    lastStdout = stdout; lastError = error;
  } catch (e) { lastError = String(e); }
  busy = false; render(true);
}

function goMap() { view = "map"; showCert = false; hintOn = false; render(); }
function goLesson(id) {
  currentId = id; view = "lesson"; lastTests = []; lastStdout = ""; lastError = ""; hintOn = false; showCert = false;
  render();
}
function goNext() {
  const i = lessonIndex(currentId);
  if (i < LESSONS.length - 1) goLesson(LESSONS[i + 1].id);
  else { showCert = true; view = "cert"; render(); }
}
function goPrev() {
  const i = lessonIndex(currentId);
  if (i > 0) goLesson(LESSONS[i - 1].id);
}

function renderNav() {
  const done = loadDone();
  return `<header class="nav">
    <div class="nav-left">
      <button class="logo" data-act="map">( ) <span>pythonCamp</span></button>
    </div>
    <div class="nav-right">
      <span class="pill">${done.size} / ${LESSONS.length} выполнено</span>
      <button class="btn btn-ghost" data-act="map">Карта курса</button>
    </div>
  </header>`;
}

function renderMap() {
  const done = loadDone();
  const pct = Math.round((done.size / LESSONS.length) * 100);
  const sections = SECTIONS.map((s) => {
    const all = s.lessons.every((l) => done.has(l.id));
    const rows = s.lessons.map((l, i) => {
      const ok = done.has(l.id);
      return `${i ? '<div class="rail"></div>' : ""}
        <button class="lesson-row" data-lesson="${l.id}">
          <span class="dot ${ok ? "done" : ""} ${l.project ? "project" : ""}"></span>
          <span>${l.project ? "Проект: " : ""}${escapeHtml(l.title)}</span>
        </button>`;
    }).join("");
    return `<section class="section-block">
      <div class="section-head">
        <div class="badge ${all ? "done" : ""}">${all ? "✓" : ""}</div>
        <div>
          <h2>${escapeHtml(s.title)}</h2>
          <small>${escapeHtml(s.blurb)} · ${s.lessons.filter((l) => done.has(l.id)).length}/${s.lessons.length}</small>
        </div>
      </div>
      ${rows}
    </section>`;
  }).join("");
  const ready = done.size === LESSONS.length;
  return `${renderNav()}
    <div class="map-wrap">
      <div class="hero">
        <h1>Сертификация: Python-разработчик</h1>
        <p>Аналог freeCodeCamp в одном файле: короткие шаги, редактор справа, тесты снизу. Python выполняется в браузере через Pyodide (CPython).</p>
        <div class="progress-wide"><div style="width:${pct}%"></div></div>
        ${ready ? `<button class="btn btn-yellow" data-act="cert">Открыть сертификат</button>` : `<p class="pill" style="display:inline-block">Прогресс ${pct}%</p>`}
      </div>
      ${sections}
    </div>`;
}

function renderLesson() {
  const lesson = LESSONS[lessonIndex(currentId)];
  const i = lessonIndex(currentId);
  const done = loadDone().has(lesson.id);
  const tests = (lastTests.length ? lastTests : lesson.tests).map((t) => {
    const mark = t.status === "pass" ? "✓" : t.status === "fail" ? "✗" : "•";
    const cls = t.status === "pass" ? "pass" : t.status === "fail" ? "fail" : "";
    return `<div class="test ${cls}"><span class="mark">${mark}</span><div>${escapeHtml(t.desc)}${t.detail ? `<div class="mono" style="font-size:12px;opacity:.8">${escapeHtml(t.detail)}</div>` : ""}</div></div>`;
  }).join("");
  const allPass = lastTests.length && lastTests.every((t) => t.status === "pass");
  return `${renderNav()}
    <div class="lesson-layout">
      <aside class="instr">
        <p class="pill" style="display:inline-block">${i + 1} / ${LESSONS.length}${lesson.project ? " · проект" : ""}${done ? " · сдано" : ""}</p>
        <h1>${escapeHtml(lesson.title)}</h1>
        ${lesson.theory}
        ${lesson.hint ? `<p><button class="btn btn-dark" data-act="hint">${hintOn ? "Скрыть подсказку" : "Подсказка"}</button></p>
          ${hintOn ? `<div class="hint-box">${escapeHtml(lesson.hint)}</div>` : ""}` : ""}
        ${allPass ? `<p style="color:var(--ok);font-weight:700">Все тесты пройдены.</p>
          <button class="btn btn-yellow" data-act="next">Следующее задание</button>` : ""}
      </aside>
      <section class="editor-pane">
        <div class="editor-tools">
          <button class="btn btn-dark" data-act="run" ${busy || !pyodide ? "disabled" : ""}>Run</button>
          <button class="btn btn-yellow" data-act="check" ${busy || !pyodide ? "disabled" : ""}>Submit</button>
          <button class="btn btn-dark" data-act="reset">Сброс кода</button>
          <span class="pill">${pyodide ? "Python 3.12 · Pyodide" : pyodideError ? "ошибка загрузки Python" : "загрузка Python…"}</span>
        </div>
        <textarea id="cm-src"></textarea>
        <div class="bottom-panes">
          <div class="pane">
            <h3>Консоль</h3>
            <pre class="console">${escapeHtml(lastError || lastStdout || (pyodide ? "// нажмите Run или Submit (Ctrl+Enter)" : "// ждём Pyodide…"))}</pre>
          </div>
          <div class="pane">
            <h3>Тесты</h3>
            <div class="tests">${tests}</div>
          </div>
        </div>
        <div class="footer-bar">
          <button class="btn btn-ghost" data-act="prev" ${i === 0 ? "disabled" : ""}>← Назад</button>
          <button class="btn btn-ghost" data-act="next">Дальше →</button>
        </div>
      </section>
    </div>`;
}

function renderCert() {
  const done = loadDone().size;
  const ok = done === LESSONS.length;
  return `${renderNav()}
    <div class="map-wrap">
      <div class="cert">
        <p style="letter-spacing:3px;text-transform:uppercase;color:#666">pythonCamp</p>
        <h2>Сертификат Python-разработчика</h2>
        <p>Настоящим подтверждается, что</p>
        <h2>${escapeHtml(getName())}</h2>
        <p>${ok ? `выполнил(а) все ${LESSONS.length} заданий полного курса Python.` : `прогресс: ${done} из ${LESSONS.length}. Дойдите до конца карты, чтобы заполнить сертификат.`}</p>
        <p style="margin-top:32px;color:#888">Аналог freeCodeCamp · ${new Date().toLocaleDateString("ru-RU")}</p>
      </div>
      <p style="text-align:center;margin-top:16px">
        <button class="btn btn-yellow" data-act="map">К карте курса</button>
      </p>
    </div>`;
}

function render(keepEditor) {
  const app = document.getElementById("app");
  const saved = cm && keepEditor ? cm.getValue() : null;
  const cursor = cm && keepEditor ? cm.getCursor() : null;
  let body = "";
  if (!pyodide && !pyodideError && view === "map") {
    body = `${renderNav()}<div class="loader"><div><div class="spin"></div><p>Загружаем CPython в браузер…</p></div></div>`;
  } else if (view === "lesson") body = renderLesson();
  else if (view === "cert") body = renderCert();
  else body = renderMap();

  if (showNameModal) {
    body += `<div class="modal-bg"><div class="modal">
      <h2>Как вас представить на сертификате?</h2>
      <p style="color:var(--muted)">Имя сохранится только в этом браузере.</p>
      <input id="name-in" placeholder="Ваше имя" value="${escapeHtml(getName() === "Студент" ? "" : getName())}" />
      <p><button class="btn btn-yellow" data-act="save-name">Продолжить</button></p>
    </div></div>`;
  }
  app.innerHTML = body;
  bind();
  if (view === "lesson") {
    const lesson = LESSONS[lessonIndex(currentId)];
    const start = saved ?? loadCodeMap()[lesson.id] ?? lesson.starter;
    const ta = document.getElementById("cm-src");
    cm = CodeMirror.fromTextArea(ta, {
      mode: "python", theme: "material-darker", lineNumbers: true, indentUnit: 4,
      extraKeys: { "Ctrl-Enter": () => checkLesson(), "Cmd-Enter": () => checkLesson() }
    });
    cm.setValue(start);
    if (cursor) cm.setCursor(cursor);
    cm.setSize("100%", "100%");
    cm.on("change", () => saveLessonCode(lesson.id, cm.getValue()));
  } else cm = null;
}

function bind() {
  document.querySelectorAll("[data-act]").forEach((el) => {
    el.onclick = () => {
      const act = el.getAttribute("data-act");
      if (act === "map") goMap();
      if (act === "run") runOnly();
      if (act === "check") checkLesson();
      if (act === "next") goNext();
      if (act === "prev") goPrev();
      if (act === "cert") { view = "cert"; render(); }
      if (act === "hint") { hintOn = !hintOn; render(true); }
      if (act === "reset") {
        const lesson = LESSONS[lessonIndex(currentId)];
        saveLessonCode(lesson.id, lesson.starter);
        if (cm) cm.setValue(lesson.starter);
      }
      if (act === "save-name") {
        const v = (document.getElementById("name-in").value || "").trim() || "Студент";
        localStorage.setItem(LS_NAME, v);
        showNameModal = false;
        render();
      }
    };
  });
  document.querySelectorAll("[data-lesson]").forEach((el) => {
    el.onclick = () => goLesson(el.getAttribute("data-lesson"));
  });
}

render();
bootPy();
  </script>
</body>
