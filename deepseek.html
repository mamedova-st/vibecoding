<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PythonCodeCamp — полный курс Python</title>
  <!-- Подключаем Font Awesome для иконок -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Подключаем highlight.js для подсветки кода -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/languages/python.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: #0a0e1a;
      color: #e2e8f0;
      line-height: 1.6;
    }

    /* Шапка */
    .header {
      background: #0f1422;
      border-bottom: 1px solid #1e2a3a;
      padding: 0.8rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
    }

    .logo i {
      color: #f7df1e;
      font-size: 2rem;
    }

    .logo span {
      background: linear-gradient(135deg, #f7df1e, #ffb347);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .progress-bar-container {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #1a2332;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      border: 1px solid #2d3f55;
    }

    .progress-text {
      font-size: 0.9rem;
      font-weight: 500;
      color: #94a3b8;
      white-space: nowrap;
    }

    .progress-track {
      width: 200px;
      height: 8px;
      background: #0b0f17;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f7df1e, #ffb347);
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .reset-btn {
      background: #2d3f55;
      border: none;
      color: #e2e8f0;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      background: #3e526b;
      color: #ffffff;
    }

    /* Основной контейнер */
    .app {
      display: flex;
      max-width: 1600px;
      margin: 0 auto;
      padding: 2rem;
      gap: 2rem;
    }

    /* Боковая панель */
    .sidebar {
      flex: 0 0 340px;
      background: #0f1422;
      border-radius: 24px;
      border: 1px solid #1e2a3a;
      padding: 1.5rem 0;
      height: fit-content;
      position: sticky;
      top: 100px;
      max-height: calc(100vh - 130px);
      overflow-y: auto;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .sidebar h2 {
      font-size: 1.2rem;
      padding: 0 1.5rem 1rem 1.5rem;
      border-bottom: 1px solid #1e2a3a;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar h2 i {
      color: #f7df1e;
    }

    .module-list {
      list-style: none;
      margin-top: 0.5rem;
    }

    .module-item {
      padding: 0.8rem 1.5rem;
      cursor: pointer;
      border-left: 4px solid transparent;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #cbd5e1;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .module-item i {
      margin-right: 12px;
      width: 20px;
      text-align: center;
      color: #64748b;
    }

    .module-item.active {
      background: #1a2332;
      border-left-color: #f7df1e;
      color: #ffffff;
    }

    .module-item.active i {
      color: #f7df1e;
    }

    .module-item .check-icon {
      color: #22c55e;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .module-item.completed .check-icon {
      opacity: 1;
    }

    .module-item.completed {
      color: #86efac;
    }

    .module-item:hover:not(.active) {
      background: #141c2b;
    }

    /* Основной контент */
    .content {
      flex: 1;
      min-width: 0;
    }

    .lesson-card {
      background: #0f1422;
      border-radius: 28px;
      border: 1px solid #1e2a3a;
      padding: 2rem 2.5rem;
      box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.6);
      margin-bottom: 2rem;
    }

    .lesson-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .lesson-subtitle {
      color: #94a3b8;
      margin-bottom: 2rem;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      border-left: 3px solid #f7df1e;
      padding-left: 1rem;
    }

    .theory {
      background: #0b101c;
      border-radius: 20px;
      padding: 1.8rem;
      margin-bottom: 2rem;
      border: 1px solid #1e2a3a;
    }

    .theory h3 {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #f7df1e;
      margin-bottom: 1.2rem;
      font-size: 1.3rem;
    }

    .theory p {
      margin-bottom: 1rem;
      color: #cbd5e1;
    }

    .theory ul, .theory ol {
      margin-left: 1.8rem;
      margin-bottom: 1rem;
      color: #cbd5e1;
    }

    .theory li {
      margin-bottom: 0.4rem;
    }

    .code-block {
      background: #0b0f17;
      border-radius: 14px;
      padding: 1.2rem;
      margin: 1.2rem 0;
      border-left: 4px solid #f7df1e;
      overflow-x: auto;
      font-size: 0.95rem;
    }

    .code-block pre {
      margin: 0;
      background: transparent !important;
    }

    .code-block code {
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
      background: transparent !important;
    }

    .task-area {
      background: #0b101c;
      border-radius: 20px;
      padding: 1.8rem;
      border: 1px solid #1e2a3a;
    }

    .task-area h3 {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #f7df1e;
      margin-bottom: 1.2rem;
      font-size: 1.3rem;
    }

    .task-description {
      background: #141c2b;
      padding: 1rem 1.2rem;
      border-radius: 14px;
      margin-bottom: 1.5rem;
      color: #cbd5e1;
      border-left: 4px solid #3b82f6;
    }

    .editor-container {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #2d3f55;
      background: #0b0f17;
      margin-bottom: 1.5rem;
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.5);
    }

    .editor-header {
      background: #1a2332;
      padding: 0.6rem 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #2d3f55;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .editor-header i {
      color: #f7df1e;
    }

    .editor {
      width: 100%;
      min-height: 180px;
      background: #0b0f17;
      border: none;
      padding: 1.2rem;
      color: #e2e8f0;
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      tab-size: 4;
    }

    .editor:focus {
      background: #0d121f;
    }

    .button-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .btn {
      padding: 0.8rem 1.8rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f7df1e, #e6b800);
      color: #0a0e1a;
      box-shadow: 0 8px 20px -6px #f7df1e80;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #ffe14d, #f7df1e);
      transform: translateY(-2px);
      box-shadow: 0 12px 25px -8px #f7df1e;
    }

    .btn-secondary {
      background: #1e2a3a;
      color: #e2e8f0;
      border: 1px solid #2d3f55;
    }

    .btn-secondary:hover {
      background: #2a3a50;
      border-color: #f7df1e;
    }

    .btn-success {
      background: #22c55e;
      color: #0a0e1a;
      box-shadow: 0 8px 20px -6px #22c55e80;
    }

    .btn-success:hover {
      background: #16a34a;
      transform: translateY(-2px);
    }

    .output-area {
      background: #0b0f17;
      border-radius: 16px;
      padding: 1.2rem;
      border: 1px solid #1e2a3a;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      color: #a5f3fc;
      min-height: 70px;
      max-height: 250px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 0.5rem;
    }

    .output-header {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }

    .feedback {
      margin-top: 1rem;
      padding: 0.8rem 1.2rem;
      border-radius: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .feedback.success {
      background: #052e16;
      color: #86efac;
      border-left: 4px solid #22c55e;
    }

    .feedback.error {
      background: #2d0a0a;
      color: #fca5a5;
      border-left: 4px solid #ef4444;
    }

    .feedback.info {
      background: #172554;
      color: #93c5fd;
      border-left: 4px solid #3b82f6;
    }

    .hidden {
      display: none;
    }

    /* Адаптивность */
    @media (max-width: 1100px) {
      .app {
        flex-direction: column;
        padding: 1.2rem;
      }
      .sidebar {
        position: static;
        flex: none;
        width: 100%;
        max-height: none;
      }
      .header {
        flex-direction: column;
        gap: 1rem;
        padding: 1rem;
      }
      .progress-bar-container {
        width: 100%;
      }
      .progress-track {
        flex: 1;
      }
    }

    @media (max-width: 600px) {
      .lesson-card {
        padding: 1.5rem;
      }
      .lesson-title {
        font-size: 1.5rem;
      }
      .button-group {
        flex-direction: column;
      }
      .btn {
        width: 100%;
        justify-content: center;
      }
    }

    /* Кастомный скроллбар */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0f17;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #2d3f55;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3e526b;
    }
  </style>
</head>
<body>
  <!-- Шапка -->
  <header class="header">
    <div class="logo">
      <i class="fab fa-python"></i>
      <span>PythonCodeCamp</span>
    </div>
    <div class="progress-bar-container">
      <span class="progress-text" id="progressText">0 / 12</span>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <button class="reset-btn" id="resetProgressBtn" title="Сбросить прогресс">
        <i class="fas fa-undo-alt"></i>
      </button>
    </div>
  </header>

  <!-- Основное приложение -->
  <div class="app">
    <!-- Боковая панель с модулями -->
    <aside class="sidebar">
      <h2><i class="fas fa-book-open"></i> Модули курса</h2>
      <ul class="module-list" id="moduleList">
        <!-- Список модулей будет сгенерирован через JS -->
      </ul>
    </aside>

    <!-- Контент урока -->
    <main class="content" id="lessonContent">
      <!-- Сюда динамически рендерится урок -->
    </main>
  </div>

  <script>
    // ============================================================
    // ДАННЫЕ КУРСА (12 модулей)
    // ============================================================
    const courseData = [
      {
        id: 'intro',
        title: 'Введение в Python',
        icon: 'fa-rocket',
        theory: `
          <h3><i class="fas fa-info-circle"></i> Что такое Python?</h3>
          <p>Python — это высокоуровневый язык программирования общего назначения, который отличается простым и читаемым синтаксисом. Он широко используется в веб-разработке, анализе данных, искусственном интеллекте и автоматизации.</p>
          <ul>
            <li><strong>Интерпретируемый</strong> — код выполняется построчно.</li>
            <li><strong>Динамически типизированный</strong> — не нужно объявлять тип переменной.</li>
            <li><strong>Мультипарадигменный</strong> — поддерживает ООП, функциональный стиль и др.</li>
          </ul>
          <p>Ваша первая программа — классическое приветствие мира:</p>
          <div class="code-block"><pre><code class="language-python">print("Hello, World!")</code></pre></div>
        `,
        task: 'Напишите программу, которая выводит текст <code>Hello, World!</code> (без кавычек).',
        placeholder: '# Напишите ваш код здесь\nprint("Hello, World!")',
        solution: 'print("Hello, World!")',
        check: (output, code) => {
          const cleaned = output.trim();
          return cleaned === 'Hello, World!';
        },
        hint: 'Используйте функцию print() с строкой "Hello, World!".'
      },
      {
        id: 'variables',
        title: 'Переменные и типы данных',
        icon: 'fa-cube',
        theory: `
          <h3><i class="fas fa-database"></i> Переменные</h3>
          <p>Переменная — это именованная область памяти для хранения данных. В Python не нужно указывать тип при объявлении.</p>
          <div class="code-block"><pre><code class="language-python">name = "Анна"      # строка (str)
age = 25           # целое число (int)
height = 1.75      # число с плавающей точкой (float)
is_student = True  # логический (bool)</code></pre></div>
          <p>Основные типы данных: <strong>int</strong>, <strong>float</strong>, <strong>str</strong>, <strong>bool</strong>.</p>
          <p>Python — язык с динамической типизацией, но вы можете проверить тип с помощью <code>type()</code>.</p>
        `,
        task: 'Создайте переменные: <code>x = 10</code> (целое), <code>y = 3.14</code> (float), <code>name = "Python"</code> (строка). Выведите на экран <strong>тип каждой переменной</strong> с новой строки, используя <code>type()</code>.',
        placeholder: '# Создайте переменные и выведите их типы\nx = 10\ny = 3.14\nname = "Python"\n\n# Ваш код ниже\n',
        solution: 'x = 10\ny = 3.14\nname = "Python"\nprint(type(x))\nprint(type(y))\nprint(type(name))',
        check: (output, code) => {
          const lines = output.trim().split('\n').map(l => l.trim());
          if (lines.length < 3) return false;
          return lines[0].includes('int') && 
                 lines[1].includes('float') && 
                 lines[2].includes('str');
        },
        hint: 'Используйте print(type(x)) для каждого переменной.'
      },
      {
        id: 'operators',
        title: 'Арифметические операторы',
        icon: 'fa-calculator',
        theory: `
          <h3><i class="fas fa-plus-minus"></i> Операторы в Python</h3>
          <p>Python поддерживает стандартные арифметические операции:</p>
          <ul>
            <li><code>+</code> сложение</li>
            <li><code>-</code> вычитание</li>
            <li><code>*</code> умножение</li>
            <li><code>/</code> деление (всегда возвращает float)</li>
            <li><code>//</code> целочисленное деление</li>
            <li><code>%</code> остаток от деления</li>
            <li><code>**</code> возведение в степень</li>
          </ul>
          <div class="code-block"><pre><code class="language-python">print(10 + 3)   # 13
print(10 / 3)   # 3.3333...
print(10 // 3)  # 3
print(10 % 3)   # 1
print(2 ** 3)   # 8</code></pre></div>
        `,
        task: 'Вычислите и выведите на экран (каждый результат с новой строки):<br>1) <code>17 // 5</code><br>2) <code>17 % 5</code><br>3) <code>2 ** 8</code><br>4) <code>10 / 4</code>',
        placeholder: '# Выведите результаты четырёх выражений\n',
        solution: 'print(17 // 5)\nprint(17 % 5)\nprint(2 ** 8)\nprint(10 / 4)',
        check: (output, code) => {
          const lines = output.trim().split('\n').map(l => l.trim());
          if (lines.length < 4) return false;
          return lines[0] === '3' && lines[1] === '2' && lines[2] === '256' && lines[3] === '2.5';
        },
        hint: 'Используйте операторы //, %, ** и /.'
      },
      {
        id: 'strings',
        title: 'Строки и методы',
        icon: 'fa-font',
        theory: `
          <h3><i class="fas fa-quote-right"></i> Строки в Python</h3>
          <p>Строки — это последовательности символов. Их можно создавать с помощью одинарных или двойных кавычек.</p>
          <div class="code-block"><pre><code class="language-python">s = "Python"
print(s[0])      # P
print(s[-1])     # n
print(s[1:4])    # yth
print(len(s))    # 6
print(s.upper()) # PYTHON
print(s.lower()) # python</code></pre></div>
          <p>Полезные методы: <code>upper()</code>, <code>lower()</code>, <code>strip()</code>, <code>replace()</code>, <code>split()</code>.</p>
        `,
        task: 'Дана строка <code>text = "  Python Programming  "</code>. Выполните:<br>1) удалите пробелы в начале и конце (<code>strip()</code>)<br>2) переведите в верхний регистр (<code>upper()</code>)<br>3) выведите результат',
        placeholder: 'text = "  Python Programming  "\n# Ваш код\n',
        solution: 'text = "  Python Programming  "\nprint(text.strip().upper())',
        check: (output, code) => {
          return output.trim() === 'PYTHON PROGRAMMING';
        },
        hint: 'Используйте цепочку методов: text.strip().upper()'
      },
      {
        id: 'lists',
        title: 'Списки',
        icon: 'fa-list',
        theory: `
          <h3><i class="fas fa-list-ul"></i> Списки (lists)</h3>
          <p>Список — упорядоченная изменяемая коллекция элементов. Создаётся с помощью квадратных скобок.</p>
          <div class="code-block"><pre><code class="language-python">fruits = ["яблоко", "банан", "вишня"]
print(fruits[0])      # яблоко
fruits.append("апельсин")
print(fruits)         # ['яблоко', 'банан', 'вишня', 'апельсин']
print(len(fruits))    # 4
fruits[1] = "груша"
print(fruits)         # ['яблоко', 'груша', 'вишня', 'апельсин']</code></pre></div>
          <p>Основные методы: <code>append()</code>, <code>insert()</code>, <code>remove()</code>, <code>pop()</code>, <code>sort()</code>.</p>
        `,
        task: 'Создайте список <code>numbers = [5, 2, 8, 1, 9]</code>. Отсортируйте его по возрастанию с помощью <code>sort()</code> и выведите результат.',
        placeholder: 'numbers = [5, 2, 8, 1, 9]\n# Отсортируйте и выведите\n',
        solution: 'numbers = [5, 2, 8, 1, 9]\nnumbers.sort()\nprint(numbers)',
        check: (output, code) => {
          const cleaned = output.trim().replace(/\s/g, '');
          return cleaned === '[1,2,5,8,9]';
        },
        hint: 'Используйте numbers.sort(), затем print(numbers).'
      },
      {
        id: 'conditionals',
        title: 'Условные операторы',
        icon: 'fa-code-branch',
        theory: `
          <h3><i class="fas fa-diagram-project"></i> if / elif / else</h3>

    // ============================================================
    // СОСТОЯНИЕ ПРИЛОЖЕНИЯ
    // ============================================================
    let currentModuleIndex = 0;
    let completedModules = new Set(); // id модулей, которые пройдены

    // Загрузка прогресса из localStorage
    function loadProgress() {
      try {
        const saved = localStorage.getItem('pythonCodeCampProgress');
        if (saved) {
          const data = JSON.parse(saved);
          completedModules = new Set(data.completed || []);
          currentModuleIndex = data.currentIndex || 0;
          if (currentModuleIndex >= courseData.length) currentModuleIndex = 0;
        }
      } catch (e) {
        console.warn('Не удалось загрузить прогресс', e);
      }
    }

    // Сохранение прогресса
    function saveProgress() {
      try {
        localStorage.setItem('pythonCodeCampProgress', JSON.stringify({
          completed: Array.from(completedModules),
          currentIndex: currentModuleIndex
        }));
      } catch (e) {
        console.warn('Не удалось сохранить прогресс', e);
      }
    }

    // Сброс прогресса
    function resetProgress() {
      if (confirm('Вы уверены, что хотите сбросить весь прогресс?')) {
        completedModules.clear();
        currentModuleIndex = 0;
        saveProgress();
        renderModuleList();
        renderLesson(currentModuleIndex);
        updateProgressBar();
      }
    }

    // РЕНДЕРИНГ СПИСКА МОДУЛЕЙ
    // ============================================================
    function renderModuleList() {
      const list = document.getElementById('moduleList');
      list.innerHTML = '';
      courseData.forEach((module, index) => {
        const li = document.createElement('li');
        li.className = `module-item ${index === currentModuleIndex ? 'active' : ''} ${completedModules.has(module.id) ? 'completed' : ''}`;

    // ============================================================
    // ОБНОВЛЕНИЕ ПРОГРЕСС-БАРА
    // ============================================================
    function updateProgressBar() {
      const total = courseData.length;
      const completed = completedModules.size;
      const percent = (completed / total) * 100;
      document.getElementById('progressFill').style.width = `${percent}%`;
      document.getElementById('progressText').textContent = `${completed} / ${total}`;
    }

    // ============================================================
    // ЭМУЛЯЦИЯ ВЫПОЛНЕНИЯ PYTHON-КОДА (упрощённая, для демонстрации)
    // ============================================================
    // В реальном проекте использовался бы Pyodide, но здесь мы эмулируем
    // выполнение для конкретных задач, чтобы избежать загрузки тяжёлых библиотек.
    // Для честной проверки мы используем предопределённые ответы в check-функциях,
    // но также предоставляем возможность запуска простых выражений через eval-подобный механизм.
    // Однако для безопасности и предсказуемости мы просто показываем "вывод" на основе
    // введённого кода (заглушка) и проверяем через check-функции.

    // Для демонстрации мы используем простой интерпретатор, который выполняет
    // только заранее определённые шаблоны. Это не полноценный Python,
    // но позволяет проверить решения.

    function runPythonCode(code) {
      // Эта функция пытается эмулировать выполнение Python-кода.
      // Мы используем ограниченный набор трансформаций, чтобы получить вывод.
      // В реальном приложении здесь должен быть Pyodide или аналогичный интерпретатор.
      
      // Простейшая эмуляция: мы ищем вызовы print() и выполняем их с помощью JS
      // ВНИМАНИЕ: это небезопасно и неполно, но для демонстрации подходит.
      
      const lines = code.split('\n');
      let output = '';
      
      // Мы будем использовать простой парсер для print и базовых операций
      // Это очень ограниченно, но позволяет проверить простые задачи.
      
      // Создаём песочницу с ограниченным набором переменных
      let sandbox = {};
      
      // Функция для вычисления выражения (очень примитивная)
      function evalExpression(expr) {
        // Заменяем Python-операторы на JS
        let jsExpr = expr
          .replace(/\bprint\s*\(/g, 'console.log(')
          .replace(/\bTrue\b/g, 'true')
          .replace(/\bFalse\b/g, 'false')
          .replace(/\bNone\b/g, 'null')
          .replace(/\btype\s*\(/g, 'typeof ')
          .replace(/\blen\s*\(/g, '.length')
          .replace(/\bstr\s*\(/g, 'String(')
          .replace(/\bint\s*\(/g, 'parseInt(')
          .replace(/\bfloat\s*\(/g, 'parseFloat(')
          .replace(/\binput\s*\(/g, 'prompt(');
        
        // Обработка range
        jsExpr = jsExpr.replace(/range\s*\(([^)]+)\)/g, (match, args) => {
          const parts = args.split(',').map(s => s.trim());
          if (parts.length === 1) return `[...Array(${parts[0]}).keys()]`;
          if (parts.length === 2) return `[...Array(${parts[1]} - ${parts[0]}).keys()].map(i => i + ${parts[0]})`;
          return `[...Array(${parts[1]} - ${parts[0]}).keys()].map(i => i + ${parts[0]}).filter(x => x < ${parts[2]})`;
        });
        
        // Обработка .append
        jsExpr = jsExpr.replace(/(\w+)\.append\s*\(/g, '$1.push(');
        
        try {
          // Используем Function для выполнения в песочнице
          const func = new Function(...Object.keys(sandbox), `return ${jsExpr}`);
          return func(...Object.values(sandbox));
        } catch (e) {
          return undefined;
        }
      }
      
      // Проходим по строкам и пытаемся выполнить простые операции
      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line || line.startsWith('#')) continue;
        
        // Обработка присваивания
        const assignMatch = line.match(/^(\w+)\s*=\s*(.+)$/);
        if (assignMatch) {
          const varName = assignMatch[1];
          const expr = assignMatch[2];
          // Пропускаем присваивание функций
          if (expr.startsWith('def ') || expr.startsWith('lambda')) continue;
          try {
            let value;
            if (expr.startsWith('"') || expr.startsWith("'")) {
              value = expr.slice(1, -1);
            } else if (expr === 'True') value = true;
            else if (expr === 'False') value = false;
            else if (expr === 'None') value = null;
            else if (/^\d+$/.test(expr)) value = parseInt(expr);
            else if (/^\d+\.\d+$/.test(expr)) value = parseFloat(expr);
            else if (expr.startsWith('[') && expr.endsWith(']')) {
              // Простой список
              try {
                value = JSON.parse(expr.replace(/'/g, '"'));
              } catch {
                value = expr;
              }
            } else {
              // Пытаемся вычислить как выражение
              const evalFunc = new Function(...Object.keys(sandbox), `return ${expr}`);
              value = evalFunc(...Object.values(sandbox));
            }
            sandbox[varName] = value;
          } catch (e) {
            // Игнорируем ошибки
          }
          continue;
        }
        
        // Обработка print
        const printMatch = line.match(/^print\s*\((.*)\)$/);
        if (printMatch) {
          let content = printMatch[1].trim();
          
          // Обработка f-строк
          if (content.startsWith('f"') || content.startsWith("f'")) {
            content = content.slice(2, -1);
            // Заменяем {var} на значения
            content = content.replace(/\{(\w+)\}/g, (match, varName) => {
              return sandbox[varName] !== undefined ? sandbox[varName] : match;
            });
            output += content + '\n';
            continue;
          }
          
          // Обработка строковых литералов
          if ((content.startsWith('"') && content.endsWith('"')) || 
              (content.startsWith("'") && content.endsWith("'"))) {
            output += content.slice(1, -1) + '\n';
            continue;
          }
          
          // Обработка переменных
          if (sandbox[content] !== undefined) {
            let val = sandbox[content];
            if (Array.isArray(val)) {
              output += JSON.stringify(val).replace(/"/g, '') + '\n';
            } else {
              output += String(val) + '\n';
            }
            continue;
          }
          
          // Обработка выражений (упрощённо)
          try {
            // Пытаемся вычислить как JS
            let jsExpr = content
              .replace(/\bTrue\b/g, 'true')
              .replace(/\bFalse\b/g, 'false')
              .replace(/\bNone\b/g, 'null')
              .replace(/type\s*\((\w+)\)/g, (match, v) => {
                const val = sandbox[v];
                if (val === undefined) return "'undefined'";
                if (typeof val === 'number') return Number.isInteger(val) ? "'int'" : "'float'";
                if (typeof val === 'string') return "'str'";
                if (typeof val === 'boolean') return "'bool'";
                return "'unknown'";
              })
              .replace(/\blen\s*\((\w+)\)/g, (match, v) => {
                return sandbox[v] ? sandbox[v].length : 0;
              })
              .replace(/(\w+)\.upper\(\)/g, (match, v) => {
                return sandbox[v] ? sandbox[v].toUpperCase() : '';
              })
              .replace(/(\w+)\.lower\(\)/g, (match, v) => {
                return sandbox[v] ? sandbox[v].toLowerCase() : '';
              })
              .replace(/(\w+)\.strip\(\)/g, (match, v) => {
                return sandbox[v] ? sandbox[v].trim() : '';
              });
            
            // Заменяем переменные
            for (let key in sandbox) {
              jsExpr = jsExpr.replace(new RegExp(`\\b${key}\\b`, 'g'), JSON.stringify(sandbox[key]));
            }
            
            const result = eval(jsExpr);
            if (result !== undefined) {
              if (Array.isArray(result)) {
                output += JSON.stringify(result).replace(/"/g, '') + '\n';
              } else {
                output += String(result) + '\n';
              }
            }
          } catch (e) {
            // Если не удалось вычислить, пробуем как строку
            output += content + '\n';
          }
          continue;
        }
        
        // Обработка циклов for (очень упрощённо)
        const forMatch = line.match(/^for\s+(\w+)\s+in\s+(.+):$/);
        if (forMatch) {
          const varName = forMatch[1];
          const iterExpr = forMatch[2];
          // Собираем тело цикла (следующие строки с отступом)
          let bodyLines = [];
          let j = i + 1;
          while (j < lines.length && (lines[j].startsWith('    ') || lines[j].startsWith('\t'))) {
            bodyLines.push(lines[j].trim());
            j++;
          }
          i = j - 1;
          
          // Пытаемся выполнить итерацию
          try {
            let iterable;
            if (iterExpr.includes('range')) {
              const rangeMatch = iterExpr.match(/range\s*\(([^)]+)\)/);
              if (rangeMatch) {
                const args = rangeMatch[1].split(',').map(s => parseInt(s.trim()));
                if (args.length === 1) {
                  iterable = Array.from({length: args[0]}, (_, i) => i);
                } else if (args.length === 2) {
                  iterable = Array.from({length: args[1] - args[0]}, (_, i) => i + args[0]);
                }
              }
            } else if (sandbox[iterExpr]) {
              iterable = sandbox[iterExpr];
            }
            
            if (iterable && Array.isArray(iterable)) {
              for (let val of iterable) {
                sandbox[varName] = val;
                // Выполняем тело цикла
                for (let bodyLine of bodyLines) {
                  const printBodyMatch = bodyLine.match(/^print\s*\((.*)\)$/);
                  if (printBodyMatch) {
                    let content = printBodyMatch[1].trim();
                    if (sandbox[content] !== undefined) {
                      output += String(sandbox[content]) + '\n';
                    } else {
                      output += content + '\n';
                    }
                  }
                }
              }
            }
          } catch (e) {
            // Игнорируем
          }
        }
      }
      
      return output;
    }

              <button class="btn btn-primary" id="runBtn"><i class="fas fa-play"></i> Запустить код</button>
              <button class="btn btn-secondary" id="hintBtn"><i class="fas fa-lightbulb"></i> Подсказка</button>
              ${!isCompleted ? `<button class="btn btn-success" id="checkBtn"><i class="fas fa-check-circle"></i> Проверить решение</button>` : ''}
            </div>
            
            <div class="output-header"><i class="fas fa-terminal"></i> Вывод программы</div>
            <div class="output-area" id="outputArea">Здесь появится результат выполнения...</div>
            
            <div id="feedbackArea"></div>
          </div>
        </div>
      `;
      
      // Навешиваем обработчики
      document.getElementById('runBtn').addEventListener('click', () => {
        const code = document.getElementById('codeEditor').value;
        const outputArea = document.getElementById('outputArea');
        outputArea.textContent = 'Выполнение...';
        try {
          const output = runPythonCode(code);
          outputArea.textContent = output || '(нет вывода)';
        } catch (e) {
          outputArea.textContent = 'Ошибка выполнения: ' + e.message;
        }
      });
      
      document.getElementById('hintBtn').addEventListener('click', () => {
        const feedback = document.getElementById('feedbackArea');
        feedback.innerHTML = `<div class="feedback info"><i class="fas fa-info-circle"></i> ${module.hint}</div>`;
      });
      
      const checkBtn = document.getElementById('checkBtn');
      if (checkBtn) {
        checkBtn.addEventListener('click', () => {
          const code = document.getElementById('codeEditor').value;
          const outputArea = document.getElementById('outputArea');
          let output;
          try {
            output = runPythonCode(code);
            outputArea.textContent = output || '(нет вывода)';
          } catch (e) {
            outputArea.textContent = 'Ошибка выполнения: ' + e.message;
            output = '';
          }
          
          const feedback = document.getElementById('feedbackArea');
          
          // Проверяем решение
          let isCorrect = false;
          try {
            isCorrect = module.check(output, code);
          } catch (e) {
            console.error('Ошибка проверки:', e);
            isCorrect = false;
          }
          
          if (isCorrect) {
            if (!completedModules.has(module.id)) {
              completedModules.add(module.id);
              saveProgress();
              updateProgressBar();
              renderModuleList();
            }
            feedback.innerHTML = `<div class="feedback success"><i class="fas fa-check-circle"></i> Отлично! Задание выполнено верно. Модуль засчитан.</div>`;
            // Перерендерим урок, чтобы обновить кнопку (убрать "Проверить")
            setTimeout(() => renderLesson(currentModuleIndex), 800);
          } else {
            feedback.innerHTML = `<div class="feedback error"><i class="fas fa-times-circle"></i> Решение неверно. Попробуйте ещё раз. Ожидаемый вывод: <code>${module.solution ? module.solution.split('\n').pop().trim() : 'см. условие'}</code></div>`;
          }
        });
      }
      
      // Подсветка синтаксиса в теории
      if (window.hljs) {
        document.querySelectorAll('.code-block code').forEach(block => {
          hljs.highlightElement(block);
        });
      }
    }

    // ============================================================
    // ИНИЦИАЛИЗАЦИЯ
    // ============================================================
    function init() {
      loadProgress();
      renderModuleList();
      renderLesson(currentModuleIndex);
      updateProgressBar();
      
      document.getElementById('resetProgressBtn').addEventListener('click', resetProgress);
      
      // Подсветка синтаксиса при первой загрузке
      if (window.hljs) {
        hljs.highlightAll();
      }
    }

    // Запуск после загрузки DOM
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
