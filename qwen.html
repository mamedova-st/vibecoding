<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — Бесплатный курс Python</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a23;
    --bg-secondary: #1b1b32;
    --bg-tertiary: #2a2a40;
    --text: #ffffff;
    --text-secondary: #dfdfe2;
    --accent: #f1be32;
    --accent-hover: #facc15;
    --success: #3bde7c;
    --error: #f85757;
    --border: #3b3b4f;
    --code-bg: #181829;
  }
  body.light {
    --bg: #ffffff;
    --bg-secondary: #f5f5f5;
    --bg-tertiary: #e5e5e5;
    --text: #1b1b32;
    --text-secondary: #2a2a40;
    --border: #d0d0d0;
    --code-bg: #f0f0f0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  header {
    background: var(--bg-secondary);
    border-bottom: 2px solid var(--accent);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-size: 22px;
    font-weight: bold;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-icon { font-size: 28px; }
  .header-actions { display: flex; gap: 10px; align-items: center; }
  .btn {
    background: var(--accent);
    color: #0a0a23;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.2s;
  }
  .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--bg-tertiary); }
  .btn-success { background: var(--success); }
  .btn-danger { background: var(--error); color: white; }

  .container { display: flex; min-height: calc(100vh - 60px); }
  .sidebar {
    width: 300px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    max-height: calc(100vh - 60px);
    position: sticky;
    top: 60px;
  }
  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    font-weight: bold;
  }
  .progress-bar {
    height: 6px;
    background: var(--bg-tertiary);
    border-radius: 3px;
    margin-top: 8px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--success);
    transition: width 0.3s;
  }
  .progress-text {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .section-title {
    padding: 12px 16px;
    font-size: 11px;
    text-transform: uppercase;
    color: var(--accent);
    letter-spacing: 1px;
    background: var(--bg-tertiary);
    font-weight: bold;
  }
  .lesson-item {
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    transition: background 0.2s;
  }
  .lesson-item:hover { background: var(--bg-tertiary); }
  .lesson-item.active { background: var(--bg-tertiary); border-left: 3px solid var(--accent); }
  .lesson-item.completed .check { color: var(--success); }
  .check { color: var(--border); font-size: 16px; }

  .main {
    flex: 1;
    padding: 32px;
    max-width: 100%;
    overflow-x: hidden;
  }
  .lesson-content {
    max-width: 800px;
    margin: 0 auto;
  }
  .lesson-title {
    font-size: 32px;
    margin-bottom: 16px;
    color: var(--accent);
  }
  .lesson-body h2 { margin: 24px 0 12px; color: var(--accent); }
  .lesson-body h3 { margin: 20px 0 10px; }
  .lesson-body p { margin: 12px 0; color: var(--text-secondary); }
  .lesson-body ul, .lesson-body ol { margin: 12px 0 12px 24px; color: var(--text-secondary); }
  .lesson-body li { margin: 6px 0; }
  .lesson-body code {
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: "Courier New", monospace;
    font-size: 0.9em;
    color: var(--accent);
  }
  .lesson-body pre {
    background: var(--code-bg);
    padding: 16px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 16px 0;
    border-left: 3px solid var(--accent);
  }
  .lesson-body pre code {
    background: transparent;
    padding: 0;
    color: var(--text);
  }
  .task-box {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    padding: 20px;
    margin: 24px 0;
    border-radius: 4px;
  }
  .task-box h3 { color: var(--accent); margin-bottom: 10px; }

  .editor-container {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    margin: 24px 0;
  }
  .editor-header {
    background: var(--bg-tertiary);
    padding: 8px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .editor-title { font-size: 13px; color: var(--text-secondary); }
  .editor-actions { display: flex; gap: 8px; }
  .editor {
    width: 100%;
    min-height: 200px;
    background: var(--code-bg);
    color: var(--text);
    border: none;
    padding: 16px;
    font-family: "Courier New", monospace;
    font-size: 14px;
    resize: vertical;
    outline: none;
    tab-size: 4;
  }
  .output {
    background: #000;
    color: #0f0;
    padding: 16px;
    font-family: "Courier New", monospace;
    font-size: 13px;
    min-height: 80px;
    max-height: 300px;
    overflow-y: auto;
    white-space: pre-wrap;
    border-top: 1px solid var(--border);
  }
  .output.error { color: var(--error); }
  .test-results {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--bg-tertiary);
  }
  .test-item {
    padding: 6px 0;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .test-pass { color: var(--success); }
  .test-fail { color: var(--error); }

  .loading-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 10, 35, 0.95);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }
  .spinner {
    width: 60px;
    height: 60px;
    border: 4px solid var(--bg-tertiary);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    margin-top: 20px;
    color: var(--text);
    font-size: 16px;
  }

  .modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 200;
  }
  .modal.active { display: flex; }
  .modal-content {
    background: var(--bg-secondary);
    padding: 32px;
    border-radius: 8px;
    max-width: 500px;
    border: 2px solid var(--accent);
    text-align: center;
  }
  .certificate {
    background: linear-gradient(135deg, var(--accent), #f59e0b);
    color: #0a0a23;
    padding: 40px;
    border-radius: 8px;
    margin: 20px 0;
  }
  .certificate h2 { font-size: 28px; margin-bottom: 10px; }

  .menu-toggle { display: none; background: transparent; border: none; color: var(--text); font-size: 24px; cursor: pointer; }

  @media (max-width: 768px) {
    .sidebar {
      position: fixed;
      left: -300px;
      top: 60px;
      transition: left 0.3s;
      z-index: 50;
    }
    .sidebar.open { left: 0; }
    .menu-toggle { display: block; }
    .main { padding: 16px; }
    .lesson-title { font-size: 24px; }
  }

  .hint {
    background: rgba(241, 190, 50, 0.1);
    border-left: 3px solid var(--accent);
    padding: 12px 16px;
    margin: 16px 0;
    border-radius: 4px;
    font-size: 14px;
  }
  .hint strong { color: var(--accent); }
</style>
</head>
<body>

<div id="loading" class="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text">Загружаем Python-интерпретатор... <span id="load-status">инициализация</span></div>
</div>

<header>
  <div style="display:flex; align-items:center; gap:16px;">
    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
    <div class="logo">
      <span class="logo-icon">🐍</span>
      <span>PyCamp</span>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn btn-secondary" onclick="toggleTheme()">🌓 Тема</button>
    <button class="btn btn-secondary" onclick="resetProgress()">🔄 Сброс</button>
    <button class="btn" onclick="showCertificate()" id="certBtn" style="display:none;">🏆 Сертификат</button>
  </div>
</header>

<div class="container">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div>📚 Курс Python</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-text" id="progressText">0 / 0 уроков</div>
    </div>
    <div id="lessonList"></div>
  </aside>

  <main class="main">
    <div class="lesson-content" id="lessonContent"></div>
  </main>
</div>

<div class="modal" id="certificateModal">
  <div class="modal-content">
    <div class="certificate">
      <h2>🏆 Сертификат PyCamp</h2>
      <p>Настоящим подтверждается, что</p>
      <h3 id="studentName" style="margin:20px 0; font-size:24px;">Студент</h3>
      <p>успешно завершил полный курс</p>
      <h3 style="margin:10px 0;">Python Programming</h3>
      <p id="certDate" style="margin-top:20px; font-size:12px;"></p>
    </div>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button class="btn" onclick="downloadCertificate()">📥 Скачать</button>
      <button class="btn btn-secondary" onclick="closeModal()">Закрыть</button>
    </div>
  </div>
</div>

<div class="modal" id="nameModal">
  <div class="modal-content">
    <h2 style="color:var(--accent); margin-bottom:16px;">Добро пожаловать в PyCamp!</h2>
    <p style="margin-bottom:20px;">Введите ваше имя для сертификата:</p>
    <input type="text" id="nameInput" style="width:100%; padding:10px; background:var(--bg-tertiary); border:1px solid var(--border); color:var(--text); border-radius:4px; margin-bottom:16px;" placeholder="Ваше имя">
    <button class="btn" onclick="saveName()">Начать обучение</button>
  </div>
</div>

<script>
// ============ КУРС: УРОКИ ============
const lessons = [
  {
    id: 'intro', section: 'Введение', title: 'Добро пожаловать в Python',
    theory: `
      <h2>Что такое Python?</h2>
      <p>Python — это высокоуровневый язык программирования общего назначения, созданный Гвидо ван Россумом в 1991 году. Он известен своим чистым синтаксисом и читаемостью кода.</p>
      <h3>Почему Python популярен?</h3>
      <ul>
        <li>Простой и понятный синтаксис</li>
        <li>Огромная стандартная библиотека</li>
        <li>Применяется в веб-разработке, Data Science, AI, автоматизации</li>
        <li>Активное сообщество разработчиков</li>
      </ul>
      <h3>Ваша первая программа</h3>
      <p>Традиционно изучение любого языка начинается с программы, выводящей "Hello, World!". В Python это делается одной строкой:</p>
      <pre><code>print("Hello, World!")</code></pre>
      <p>Функция <code>print()</code> выводит текст на экран. Текст заключается в кавычки — это называется <strong>строкой</strong>.</p>
    `,
    task: 'Выведите на экран фразу: <strong>Hello, World!</strong>',
    initialCode: '# Напишите ваш первый код здесь\n',
    tests: [
      { check: (out) => out.includes('Hello, World!'), msg: 'Программа выводит "Hello, World!"' }
    ]
  },
  {
    id: 'comments', section: 'Введение', title: 'Комментарии',
    theory: `
      <h2>Комментарии в Python</h2>
      <p>Комментарии — это пояснения в коде, которые игнорируются интерпретатором. Они помогают другим разработчикам (и вам самим в будущем) понять логику программы.</p>
      <h3>Однострочные комментарии</h3>
      <p>Начинаются с символа <code>#</code>:</p>
      <pre><code># Это комментарий
print("Привет")  # Это тоже комментарий</code></pre>
      <h3>Многострочные комментарии</h3>
      <p>Обычно используют тройные кавычки:</p>
      <pre><code>"""
Это многострочный
комментарий
"""</code></pre>
    `,
    task: 'Напишите программу, которая выводит <strong>Python</strong> и содержит комментарий <code># мой код</code>',
    initialCode: '# Напишите программу\n',
    tests: [
      { check: (out, code) => out.includes('Python'), msg: 'Программа выводит "Python"' },
      { check: (out, code) => code.includes('#'), msg: 'В коде есть комментарий' }
    ]
  },
  {
    id: 'variables', section: 'Основы', title: 'Переменные',
    theory: `
      <h2>Переменные</h2>
      <p>Переменная — это именованная область памяти для хранения данных. В Python не нужно объявлять тип переменной — он определяется автоматически.</p>
      <pre><code>name = "Алиса"
age = 25
height = 1.68
is_student = True</code></pre>
      <h3>Правила именования</h3>
      <ul>
        <li>Имя может содержать буквы, цифры и символ подчёркивания</li>
        <li>Не может начинаться с цифры</li>
        <li>Регистр имеет значение: <code>name</code> и <code>Name</code> — разные переменные</li>
        <li>Нельзя использовать ключевые слова Python (<code>if</code>, <code>for</code>, <code>class</code> и др.)</li>
      </ul>
      <h3>Вывод переменных</h3>
      <pre><code>name = "Боб"
print(name)          # Боб
print("Имя:", name)  # Имя: Боб</code></pre>
    `,
    task: 'Создайте переменную <code>language</code> со значением <strong>"Python"</strong> и выведите её на экран.',
    initialCode: '# Создайте переменную language\n',
    tests: [
      { check: (out) => out.includes('Python'), msg: 'Программа выводит "Python"' },
      { check: (out, code) => /language\s*=/.test(code), msg: 'Создана переменная language' }
    ]
  },
  {
    id: 'datatypes', section: 'Основы', title: 'Типы данных',
    theory: `
      <h2>Основные типы данных</h2>
      <p>Python имеет несколько встроенных типов данных:</p>
      <ul>
        <li><code>int</code> — целые числа: <code>42</code>, <code>-7</code>, <code>0</code></li>
        <li><code>float</code> — дробные числа: <code>3.14</code>, <code>-0.5</code></li>
        <li><code>str</code> — строки: <code>"Привет"</code>, <code>'Мир'</code></li>
        <li><code>bool</code> — логический тип: <code>True</code> или <code>False</code></li>
        <li><code>NoneType</code> — отсутствие значения: <code>None</code></li>
      </ul>
      <h3>Определение типа</h3>
      <p>Функция <code>type()</code> возвращает тип объекта:</p>
      <pre><code>x = 42
print(type(x))  # &lt;class 'int'&gt;

y = "hello"
print(type(y))  # &lt;class 'str'&gt;</code></pre>
    `,
    task: 'Создайте переменные: число <code>x = 10</code>, строку <code>s = "test"</code> и выведите их типы с помощью <code>type()</code>.',
    initialCode: '# Создайте переменные и выведите их типы\n',
    tests: [
      { check: (out) => out.includes('int'), msg: 'Выводится тип int' },
      { check: (out) => out.includes('str'), msg: 'Выводится тип str' }
    ]
  },
  {
    id: 'strings', section: 'Основы', title: 'Работа со строками',
    theory: `
      <h2>Строки</h2>
      <p>Строка — это последовательность символов. В Python строки неизменяемы.</p>
      <h3>Создание строк</h3>
      <pre><code>s1 = "Привет"
s2 = 'Мир'
s3 = """Многострочная
строка"""</code></pre>
      <h3>Операции со строками</h3>
      <pre><code># Конкатенация (склеивание)
s = "Привет" + " " + "Мир"  # "Привет Мир"

# Повторение
s = "Ха" * 3  # "ХаХаХа"

# Длина строки
len("Python")  # 6</code></pre>
      <h3>Форматирование строк (f-strings)</h3>
      <pre><code>name = "Алиса"
age = 25
print(f"Меня зовут {name}, мне {age} лет")</code></pre>
      <h3>Основные методы</h3>
      <pre><code>s = "Hello, World!"
s.upper()      # "HELLO, WORLD!"
s.lower()      # "hello, world!"
s.replace("Hello", "Hi")  # "Hi, World!"
s.split(",")   # ["Hello", " World!"]</code></pre>
    `,
    task: 'Создайте переменные <code>name = "Python"</code> и <code>version = 3</code>. Выведите строку <strong>"Python 3"</strong> используя f-строку.',
    initialCode: '# Используйте f-строку\n',
    tests: [
      { check: (out) => out.includes('Python 3'), msg: 'Выводится "Python 3"' },
      { check: (out, code) => code.includes('f"') || code.includes("f'"), msg: 'Использована f-строка' }
    ]
  },
  {
    id: 'numbers', section: 'Основы', title: 'Числа и арифметика',
    theory: `
      <h2>Арифметические операции</h2>
      <pre><code>a = 10
b = 3

print(a + b)   # 13  — сложение
print(a - b)   # 7   — вычитание
print(a * b)   # 30  — умножение
print(a / b)   # 3.333... — деление (float)
print(a // b)  # 3   — целочисленное деление
print(a % b)   # 1   — остаток от деления
print(a ** b)  # 1000 — возведение в степень</code></pre>
      <h3>Приоритет операций</h3>
      <p>Как в математике: сначала скобки, потом степень, умножение/деление, сложение/вычитание.</p>
      <pre><code>result = 2 + 3 * 4  # 14, а не 20
result = (2 + 3) * 4  # 20</code></pre>
      <h3>Преобразование типов</h3>
      <pre><code>int("42")    # 42
float("3.14") # 3.14
str(100)     # "100"</code></pre>
    `,
    task: 'Вычислите и выведите результат: <strong>2 в степени 10</strong> (должно получиться 1024).',
    initialCode: '# Вычислите 2 в степени 10\n',
    tests: [
      { check: (out) => out.includes('1024'), msg: 'Результат равен 1024' }
    ]
  },
  {
    id: 'input', section: 'Основы', title: 'Ввод данных',
    theory: `
      <h2>Функция input()</h2>
      <p>Функция <code>input()</code> позволяет получать данные от пользователя. Она всегда возвращает строку.</p>
      <pre><code>name = input("Как вас зовут? ")
print("Привет,", name)</code></pre>
      <h3>Преобразование ввода</h3>
      <p>Поскольку <code>input()</code> возвращает строку, для чисел нужно преобразование:</p>
      <pre><code>age = int(input("Ваш возраст: "))
print("Через 5 лет вам будет", age + 5)</code></pre>
      <div class="hint"><strong>⚠️ Важно:</strong> В нашей среде ввод данных эмулируется — при запуске программы будет использовано тестовое значение.</div>
    `,
    task: 'Напишите программу, которая выводит <strong>"Hello, User!"</strong> (используя конкатенацию строк).',
    initialCode: '# Выведите приветствие\n',
    tests: [
      { check: (out) => out.includes('Hello, User!'), msg: 'Выводится "Hello, User!"' }
    ]
  },

// ============ СОСТОЯНИЕ ============
let state = {
  currentLesson: 0,
  completed: new Set(),
  studentName: localStorage.getItem('pycamp_name') || '',
  theme: localStorage.getItem('pycamp_theme') || 'dark',
  code: {}
};

// Загрузка прогресса
const savedProgress = localStorage.getItem('pycamp_progress');
if (savedProgress) {
  try { state.completed = new Set(JSON.parse(savedProgress)); } catch(e) {}
}
const savedCode = localStorage.getItem('pycamp_code');
if (savedCode) {
  try { state.code = JSON.parse(savedCode); } catch(e) {}
}

// ============ PYODIDE ============
let pyodide = null;

async function loadPyodideRuntime() {
  const status = document.getElementById('load-status');
  try {
    status.textContent = 'загрузка скрипта...';
    await loadScript('https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js');
    status.textContent = 'инициализация Python...';
    pyodide = await loadPyodide({
      indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/'
    });
    status.textContent = 'готово!';
    setTimeout(() => {
      document.getElementById('loading').style.display = 'none';
      if (!state.studentName) {
        document.getElementById('nameModal').classList.add('active');
      }
    }, 500);
  } catch (e) {
    console.error(e);
    status.textContent = 'ошибка загрузки. Попробуйте обновить страницу.';
  }
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

// ============ РЕНДЕРИНГ ============
function renderSidebar() {
  const list = document.getElementById('lessonList');
  let html = '';
  let currentSection = '';
  
  lessons.forEach((lesson, idx) => {
    if (lesson.section !== currentSection) {
      currentSection = lesson.section;
      html += `<div class="section-title">${currentSection}</div>`;
    }
    const active = idx === state.currentLesson ? 'active' : '';
    const completed = state.completed.has(lesson.id) ? 'completed' : '';
    const check = state.completed.has(lesson.id) ? '✓' : '○';
    html += `<div class="lesson-item ${active} ${completed}" onclick="goToLesson(${idx})">
      <span class="check">${check}</span>
      <span>${lesson.title}</span>
    </div>`;
  });
  list.innerHTML = html;
  
  const total = lessons.length;
  const done = state.completed.size;
  document.getElementById('progressFill').style.width = (done/total*100) + '%';
  document.getElementById('progressText').textContent = `${done} / ${total} уроков`;
  
  document.getElementById('certBtn').style.display = done === total ? 'inline-block' : 'none';
}

function renderLesson() {
  const lesson = lessons[state.currentLesson];
  const savedCode = state.code[lesson.id] || lesson.initialCode;
  
  const content = document.getElementById('lessonContent');
  content.innerHTML = `
    <h1 class="lesson-title">${lesson.title}</h1>
    <div class="lesson-body">${lesson.theory}</div>
    
    <div class="task-box">
      <h3>📝 Задание</h3>
      <p>${lesson.task}</p>
    </div>
    
    <div class="editor-container">
      <div class="editor-header">
        <span class="editor-title">🐍 Редактор Python</span>
        <div class="editor-actions">
          <button class="btn btn-secondary" onclick="resetCode()" title="Сбросить код">↺</button>
          <button class="btn" onclick="runCode()">▶ Запустить (Ctrl+Enter)</button>
        </div>
      </div>
      <textarea class="editor" id="codeEditor" spellcheck="false">${escapeHtml(savedCode)}</textarea>
      <div class="output" id="output">Нажмите "Запустить" для выполнения кода...</div>
      <div class="test-results" id="testResults" style="display:none;"></div>
    </div>
    
    <div style="display:flex; justify-content:space-between; margin-top:24px;">
      <button class="btn btn-secondary" onclick="prevLesson()" ${state.currentLesson === 0 ? 'disabled' : ''}>← Назад</button>
      <button class="btn btn-success" onclick="nextLesson()" ${state.currentLesson === lessons.length - 1 ? 'disabled' : ''}>Далее →</button>
    </div>
  `;
  
  // Обработка Tab в редакторе
  const editor = document.getElementById('codeEditor');
  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
      editor.selectionStart = editor.selectionEnd = start + 4;
      saveCurrentCode();
    }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      runCode();
    }
  });
  editor.addEventListener('input', saveCurrentCode);
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ============ ВЫПОЛНЕНИЕ КОДА ============
async function runCode() {
  const code = document.getElementById('codeEditor').value;
  const output = document.getElementById('output');
  const testResults = document.getElementById('testResults');
  
  if (!pyodide) {
    output.textContent = 'Python ещё загружается...';
    output.className = 'output error';
    return;
  }
  
  output.textContent = 'Выполнение...';
  output.className = 'output';
  
  // Перехват stdout/stderr
  pyodide.runPython(`
import sys
from io import StringIO
_stdout = StringIO()
_stderr = StringIO()
sys.stdout = _stdout
sys.stderr = _stderr
_output_error = None
try:
    pass
except Exception as e:
    _output_error = str(e)
  `);
  
  try {
    // Заменяем input() на фиктивное значение для тестов
    const wrappedCode = `
import sys
from io import StringIO

class MockInput:
    def __init__(self):
        self.values = iter(["test", "10", "Python"])
    def __call__(self, prompt=""):
        try:
            v = next(self.values)
            return v
        except StopIteration:
            return ""

_mock_input = MockInput()
_real_input = input
import builtins
builtins.input = _mock_input

_stdout = StringIO()
_stderr = StringIO()
sys.stdout = _stdout
sys.stderr = _stderr

try:
${code.split('\n').map(l => '    ' + l).join('\n')}
    _exec_error = None
except Exception as _e:
    _exec_error = str(_e)

sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
builtins.input = _real_input
_result_out = _stdout.getvalue()
_result_err = _stderr.getvalue()
`;
    
    pyodide.runPython(wrappedCode);
    const resultOut = pyodide.globals.get('_result_out');
    const resultErr = pyodide.globals.get('_result_err');
    const execError = pyodide.globals.get('_exec_error');
    
    if (execError && execError !== 'None') {
      output.textContent = '❌ Ошибка:\n' + execError;
      output.className = 'output error';
      testResults.style.display = 'none';
      return;
    }
    
    output.textContent = resultOut || '(нет вывода)';
    if (resultErr) {
      output.textContent += '\n\n⚠️ Предупреждения:\n' + resultErr;
    }
    output.className = 'output';
    
    // Проверка тестов
    runTests(code, resultOut);
    
  } catch (e) {
    output.textContent = '❌ Ошибка выполнения:\n' + e.message;
    output.className = 'output error';
    testResults.style.display = 'none';
  }
}

function runTests(code, output) {
  const lesson = lessons[state.currentLesson];
  const testResults = document.getElementById('testResults');
  let html = '<strong>Результаты проверки:</strong>';
  let allPassed = true;
  
  lesson.tests.forEach(test => {
    try {
      const passed = test.check(output, code);
      if (passed) {
        html += `<div class="test-item test-pass">✓ ${test.msg}</div>`;
      } else {
        html += `<div class="test-item test-fail">✗ ${test.msg}</div>`;
        allPassed = false;
      }
    } catch (e) {
      html += `<div class="test-item test-fail">✗ ${test.msg} (ошибка проверки)</div>`;
      allPassed = false;
    }
  });
  
  if (allPassed) {
    html += '<div style="margin-top:10px; color:var(--success); font-weight:bold;">🎉 Отлично! Задание выполнено!</div>';
    if (!state.completed.has(lesson.id)) {
      state.completed.add(lesson.id);
      saveProgress();
      renderSidebar();
    }
  } else {
    html += '<div style="margin-top:10px; color:var(--error);">Попробуйте ещё раз.</div>';
  }
  
  testResults.innerHTML = html;
  testResults.style.display = 'block';
}

// ============ НАВИГАЦИЯ ============
function goToLesson(idx) {
  state.currentLesson = idx;
  renderLesson();
  renderSidebar();
  document.getElementById('sidebar').classList.remove('open');
  window.scrollTo(0, 0);
}

function nextLesson() {
  if (state.currentLesson < lessons.length - 1) {
    goToLesson(state.currentLesson + 1);
  }
}

function prevLesson() {
  if (state.currentLesson > 0) {
    goToLesson(state.currentLesson - 1);
  }
}

function resetCode() {
  const lesson = lessons[state.currentLesson];
  document.getElementById('codeEditor').value = lesson.initialCode;
  saveCurrentCode();
}

function saveCurrentCode() {
  const lesson = lessons[state.currentLesson];
  state.code[lesson.id] = document.getElementById('codeEditor').value;
  localStorage.setItem('pycamp_code', JSON.stringify(state.code));
}

function saveProgress() {
  localStorage.setItem('pycamp_progress', JSON.stringify([...state.completed]));
}

function resetProgress() {
  if (confirm('Сбросить весь прогресс? Это действие нельзя отменить.')) {
    state.completed.clear();
    state.code = {};
    localStorage.removeItem('pycamp_progress');
    localStorage.removeItem('pycamp_code');
    renderSidebar();
    renderLesson();
  }
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function toggleTheme() {
  document.body.classList.toggle('light');
  state.theme = document.body.classList.contains('light') ? 'light' : 'dark';
  localStorage.setItem('pycamp_theme', state.theme);
}

// ============ СЕРТИФИКАТ ============
function showCertificate() {
  document.getElementById('studentName').textContent = state.studentName;
  document.getElementById('certDate').textContent = 'Выдан: 9 октября 2026 г.';
  document.getElementById('certificateModal').classList.add('active');
}

function closeModal() {
  document.getElementById('certificateModal').classList.remove('active');
}

function downloadCertificate() {
  const name = state.studentName;
  const html = `
    <html><head><meta charset="utf-8"><title>Сертификат PyCamp</title>
    <style>
      body { font-family: Georgia, serif; text-align: center; padding: 60px; background: linear-gradient(135deg, #f1be32, #f59e0b); min-height: 100vh; }

      p { font-size: 18px; color: #333; margin: 10px 0; }

    </style></head><body>

  a.download = 'pycamp_certificate.html';
  a.click();
}

function saveName() {
  const name = document.getElementById('nameInput').value.trim();
  if (name) {
    state.studentName = name;
    localStorage.setItem('pycamp_name', name);
    document.getElementById('nameModal').classList.remove('active');
  }
}

// ============ ИНИЦИАЛИЗАЦИЯ ============
if (state.theme === 'light') document.body.classList.add('light');
renderSidebar();
renderLesson();
loadPyodideRuntime();
</script>
